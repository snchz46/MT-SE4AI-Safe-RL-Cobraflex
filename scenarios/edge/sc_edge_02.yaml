id: SC-EDGE-02
category: edge
# Track mapping (F4 reconciliation, Option A — run on the oval; see docs/05, 'Track mapping').
track:
  world: lane_following_oval.world
  centerline: oval_right_lane_centerline.yaml
  start_s_m: 0.0          # 0.0 = straight start, 1.5 = curve entry
commanded_speed_mps: 0.2     # env fixed_speed (supersedes the 0.3/0.4 prose in docs/05)

description: |
  Initial lateral perturbation. Vehicle initialises on the straight with a
  0.12 m lateral offset (near the C-01 warning band) and zero heading error.
  Tests recovery to centre without touching the road boundary, and the
  activation of C-01 / C-03. Recovery target (offset < 0.05 m within 3 s)
  fits within the 1.5 m straight at the cruise speed.

initial_conditions:
  pose: { x: 0.0, y: 0.12, theta_deg: 0.0 }   # y = lateral offset (seed)
  speed_mps: 0.2
  randomisation:
    lateral_offset_uniform_m: [-0.02, 0.02]   # on top of the 0.12 m seed → independent runs
    heading_uniform_deg: [-2.0, 2.0]

perturbations: none

termination:
  type: time_or_event
  timeout_s: 15.0
  events: [lane_exit, emergency_stop, straight_completed]

metrics_primary: [M-I1, M-S1]
metrics_secondary: [M-P1, M-S4]

pass_criterion_per_run: "M-S1 < 0.16 AND emergency == False"
pass_criterion_per_scenario: "fraction_pass >= 0.90"

references_SR: [SR-001, SR-003]

n_runs_recommended:
  enforcement: 30
  monitoring: 30
