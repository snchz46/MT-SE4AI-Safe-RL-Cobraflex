# Scenario YAML schema
# ------------------------------------------------------------
# Every scenario YAML under scenarios/<category>/ must conform to this schema.
# Validated by tools/check_scenario_yaml.py before any Gate review.

# Required top-level keys:
#
# id:                   string, format SC-{NOM|EDGE|PERT|FRONT}-NN
# category:             nominal | edge | perturbed | frontier
# description:          free-text summary
# initial_conditions:   block of pose, speed, randomisation
# perturbations:        block describing applied perturbations (or "none").
#                       Runtime types injected by the F4 executor
#                       (cobraflex_rl.scenario_perturbations), level-resolved by rep:
#                         observation_noise: {channel: lateral_offset, distribution: gaussian,
#                                             sigma_levels_m: [..]}   # SC-PERT-01
#                         actuation_latency: {latency_levels_ms: [..]}              # SC-PERT-02
#                         throttle_override: {at_time_s, duration_s, throttle}      # SC-EDGE-03
#                       Non-runtime mechanisms live elsewhere: SC-EDGE-05 uses
#                       initial_conditions.type=parameterised_grid; SC-PERT-03 uses
#                       perturbations.type=pre_run_policy_finetune (a pre-run policy swap).
# termination:          block of termination criteria
# metrics_primary:      list of metric IDs (M-*); a few per-run event/quantity
#                       fields the executor records directly are also accepted by
#                       name: time_to_recovery_heading, road_edge_contact (the
#                       per-run event behind M-S5) and max_excursion_m (= M-S1).
# metrics_secondary:    list of metric IDs
# pass_criterion_per_run:   string with rule for pass/fail per run
# pass_criterion_per_scenario: string with aggregate rule
# references_SR:        list of SR IDs (SR-XXX)
# n_runs_recommended:   integer per mode
#
# Categories:
#   nominal (NOM)   — operational conditions within the ODD.
#   edge (EDGE)     — at the ODD boundary, stressing a specific cage rule.
#   perturbed (PERT)— sensor noise, latency or other runtime perturbations.
#   frontier (FRONT)— out-of-ODD / cage-efficacy study (docs/05). Analysed as a
#                     PAIRED enforcement-vs-monitoring contrast (monitoring = the
#                     no-cage counterfactual), not aggregated by fraction_pass for
#                     the global verdict.

# Example minimal scenario:
#
# id: SC-NOM-01
# category: nominal
# description: Straight nominal run.
# initial_conditions:
#   pose: { x: 0.0, y: 0.0, theta_deg: 0.0 }
#   speed_mps: 0.0
#   randomisation:
#     lateral_offset_uniform_m: [-0.02, 0.02]
#     heading_uniform_deg: [-2, 2]
# perturbations: none
# termination:
#   type: time_or_event
#   timeout_s: 30.0
#   events: [lane_exit, emergency_stop]
# metrics_primary: [M-P1, M-P2, M-I1]
# metrics_secondary: [M-S1, M-I5]
# pass_criterion_per_run: "M-P1 < 0.05 AND M-P2 == 1 AND emergency==False"
# pass_criterion_per_scenario: "fraction_pass >= 0.95"
# references_SR: [SR-001, SR-006]
# n_runs_recommended: 50
