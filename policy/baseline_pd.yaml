# =============================================================
# Baseline PD controller — parameter file
# -------------------------------------------------------------
# Per Phase 2 plan §10.2 and §10.3 (D31–D32). Values are initial
# guesses from the plan; the empirical tuning campaign described in
# `docs/.phases/Fase 2/phase2_implementation_notes.md` §3.5 may
# revise them. The PD is infrastructure ("good enough to validate the
# pipeline"), not a contribution; final acceptance is the 80 %
# completion-rate threshold of Decision 6 of the supervisor briefing.
# =============================================================

baseline_pd:
  version: "0.4.0"

  # Steering loop — lateral position
  kp_y: 5.0            # gain on lateral_offset (was 12.0; reduced so steering
                       # does not saturate at ey~8 cm, which caused bang-bang
                       # oscillation on curve entry of the oval R=0.8 m).
  kd_y: 1.0            # gain on lateral_rate (was 3.0; reduced to limit
                       # amplification of finite-difference noise).

  # Steering loop — heading
  kp_h: 1.5            # gain on heading_error
  kd_h: 0.0            # was 0.4; zeroed because track_heading is piecewise-
                       # constant along the discretised centerline polyline
                       # (~7 deg jumps per ~0.5 s of travel on R=0.8 m
                       # curves), so finite-differencing produces spurious
                       # 2-3 rad/s peaks that saturate the steering at
                       # every segment transition and drove the robot into
                       # C-05 emergency.

  # Curvature feedforward (introduced in v0.4.0). Eliminates the steady-
  # state lateral offset that a proportional-only outer loop otherwise
  # needs to hold a curve. The gain equals v_nominal / yaw_to_steering_gain,
  # where v_nominal = 0.2 m/s (the fixed_speed of vehicle_control_node)
  # and yaw_to_steering_gain = 0.8 (the default of vehicle_control_node).
  # If those values change, this gain must change too (or set it to 0
  # to disable the feedforward, falling back to v0.3.0 behaviour).
  kappa_to_steering_gain: 0.25

  # Throttle
  throttle_nominal: 0.5       # nominal cruise throttle on straight
  alpha_curve_slowdown: 0.6   # reduces throttle proportionally to |curvature|

  # Saturation
  steering_limit: 1.0  # normalised actuator range
  throttle_min: 0.0    # lowest throttle command (no negative throttle from PD)
  throttle_max: 1.0
