# ============================================================================
# COMPLEX_B VARIANT (DRAFT - generated 2026-06-22). Track block re-pointed to
# complex_b; initial_conditions/perturbations are COPIED FROM THE OVAL and NOT
# yet validated for complex_b geometry (start (-2.8,-1.5), yaw -0.27 rad,
# perimeter 19.22 m vs the oval's 8.79 m). VALIDATE before any verdict run:
#   - start_s_m semantics ('1.5 = curve entry' is oval-specific)
#   - the 'straight_completed' event + timeout_s (oval assumed a 1.5 m straight)
#   - perturbation at_time_s (timed to oval features)
# Oval originals (frozen F4/139k evidence) are untouched in scenarios/. See README.
# ============================================================================
id: SC-NOM-03
category: nominal
# Track mapping: complex_b variant (re-pointed from the oval Option-A mapping; see README).
track:
  world: lane_following_oval_complex.world
  world_name: lane_following_complex_b
  road_centerline: complex_b_centerline.yaml
  centerline: complex_b_right_lane_centerline.yaml
  start_s_m: 0.0          # 0.0 = straight start, 1.5 = curve entry
commanded_speed_mps: 0.2     # env fixed_speed (supersedes the 0.3/0.4 prose in docs/05)

description: |
  Full-circuit run. Vehicle completes three full laps of the oval (alternating
  1.5 m straights and R = 0.8 m curves), testing consistency over extended
  duration. No perturbations.

initial_conditions:
  pose: { x: 0.0, y: 0.0, theta_deg: 0.0 }
  speed_mps: 0.0
  randomisation:
    lateral_offset_uniform_m: [-0.02, 0.02]
    heading_uniform_deg: [-2.0, 2.0]

perturbations: none

termination:
  type: time_or_event
  timeout_s: 120.0
  events: [lane_exit, emergency_stop, laps_completed]

# M-P4 gates SR-002 (heading ≤ θ_max = 25° = 0.436 rad) in nominal; emergency == False
# is the no-false-activation check that verifies SR-005 / SR-007 hold in nominal
# (the compound-state / staleness emergencies must not false-trigger). M-S3 reported.
metrics_primary: [M-P1, M-P2, M-P4, M-P6, M-S1, M-S3, M-I5]
metrics_secondary: [M-I1]

pass_criterion_per_run: "M-P2 == 1 AND emergency == False AND M-P1 < 0.06 AND M-S1 < 0.16 AND M-P4 < 0.436"
pass_criterion_per_scenario: "fraction_pass >= 0.90"

references_SR: [SR-001, SR-002, SR-003, SR-004, SR-005, SR-006, SR-007, SR-008, SR-009]

n_runs_recommended:
  enforcement: 25          # ≥25 per D-29 (verifies SR-008, SR-CL-A)
  monitoring: 25
