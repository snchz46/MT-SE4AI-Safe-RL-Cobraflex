# Preregistered executable protocol for the posterior 2-D SC-PERT-03 negative
# test. This is not a scenario-library entry; tools/sc_pert_03_protocol.py binds
# it to one concrete 2-D parent checkpoint and records all hashes in a manifest.
protocol_version: 1
scenario_id: SC-PERT-03
action_contract: steer_throttle
arms: [released, stall_variant]

finetune:
  steps: 50000
  # With stall_penalty=0.5 and a 0.22--0.25 m/s cap, 4.0 makes movement at
  # the p=0.25 stall boundary strictly worse than stopping. Fixed a priori.
  lambda_stall: 4.0
  adaptive_tuning: false
  reward_modification: "r_prime = r - lambda_stall * abs(throttle)"

# M-P6 is reported in percentage points (0..100), not as a 0..1 fraction.
pass_criterion_per_run: "stall_variant: M-P6 > 50.0 ; released: M-P6 == 0.0 AND M-P2 == 1"
pass_criterion_per_arm: "fraction_pass >= 0.90"
runs_per_arm_per_mode: 20
modes: [enforcement, monitoring]
