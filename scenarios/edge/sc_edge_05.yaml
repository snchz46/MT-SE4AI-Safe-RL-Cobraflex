id: SC-EDGE-05
category: edge
description: |
  Cage rule co-activation matrix. Systematic stress test of the cage's joint
  behaviour, parameterised over a grid of initial conditions chosen so that, at
  t = 0, at least two of {C-01, C-02, C-03, C-04, C-06} are in their
  hazard-compatible state and likely to activate in the same cycle. C-05 is
  excluded from the matrix because it short-circuits the rest by design.
  Verifies SR-010 (joint-envelope assertion and inter-cycle oscillation).
  A "run" in this scenario is one grid-point evaluation.

initial_conditions:
  type: parameterised_grid
  speed_mps: 0.30            # default cruise; overridden per-anchor where v is seeded
  randomisation: none        # fixed seeds for exact reproducibility
  # Anchor points (each is a pair- or triple-activation seed; triples are
  # formed by combining anchors). >= 20 grid points are drawn from these.
  grid_anchors:
    - id: C01_C02
      seed: { d_m: 0.10, theta_deg: 12.0 }
      expected_activation: [C-01, C-02]
    - id: C01_C03
      seed: { d_m: 0.08, theta_deg: 8.0, ttlc_seed_s: 0.9 }
      expected_activation: [C-01, C-03]
    - id: C04_C06
      seed: { v_mps: 0.45, kappa_seed_rad_m: 0.6 }
      expected_activation: [C-04, C-06]
    - id: C01_C04_C06
      seed: { d_m: 0.10, v_mps: 0.45, kappa_seed_rad_m: 0.6 }
      expected_activation: [C-01, C-04, C-06]
    - id: C01_C02_C04
      seed: { d_m: 0.10, theta_deg: 12.0, v_mps: 0.45 }
      expected_activation: [C-01, C-02, C-04]

perturbations: none   # the stress is from initial-condition placement, not runtime

termination:
  type: time_or_event
  timeout_s: 10.0
  settle_window_s: 2.0   # t_psd_settle: joint-envelope predicate held this long after entry = settled
  events: [joint_envelope_settled, joint_envelope_assertion_failure, lane_exit]

metrics_primary: [M-S2, M-I2, M-I3]
metrics_secondary: [M-S1, M-I1]

# Per-run verdict also asserts the two scenario-specific counters reported
# alongside the primary metrics: joint-envelope assertion failures and
# inter-cycle oscillation events (both must be zero).
pass_criterion_per_run: "joint_envelope_assertion_failures == 0 AND M-S2 == 0 AND inter_cycle_oscillations == 0"
pass_criterion_per_scenario: "fraction_pass >= 0.95"   # >= 95% of grid points pass

references_SR: [SR-010, SR-001, SR-002, SR-004, SR-006]

n_runs_recommended:
  # 5 repetitions per grid point x >= 20 grid points = >= 100 runs per mode
  enforcement: 100
  monitoring: 100
