<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ROS2 Graph</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width:100%; height:100%; overflow:hidden; background:#0d1117; }
  body { font-family: "Inter", "Segoe UI", sans-serif; font-size: 13px; color: #e6edf3; }
  #root { width:100vw; height:100vh; display:flex; flex-direction:column; }

  ::-webkit-scrollbar { width:6px; }
  ::-webkit-scrollbar-track { background:#0d1117; }
  ::-webkit-scrollbar-thumb { background:#21262d; border-radius:3px; }
  ::-webkit-scrollbar-thumb:hover { background:#30363d; }

  input { outline:none; font-family:inherit; }

  /* Toolbar */
  .toolbar {
    background:#0d1117; border-bottom:1px solid #161b22;
    display:flex; align-items:center; gap:10px;
    padding:0 16px; height:38px; flex-shrink:0;
    font-size:11px;
  }
  .toolbar-sep { width:1px; height:16px; background:#21262d; }

  /* Panels */
  .panel {
    background:#161b22; border:1px solid #21262d;
    display:flex; flex-direction:column; overflow:hidden;
  }
  .panel-header {
    padding:6px 10px; border-bottom:1px solid #21262d;
    display:flex; align-items:center; gap:6px; flex-shrink:0;
    background:#0d1117; font-size:10px; font-weight:600;
    color:#8b949e; letter-spacing:0.06em; text-transform:uppercase;
  }
  .panel-header-dot {
    width:6px; height:6px; border-radius:50%;
  }
  .panel-body { flex:1; overflow:hidden; min-height:0; }

  /* Sidebar list items */
  .list-item {
    padding:5px 10px; cursor:pointer; border-left:2px solid transparent;
    transition:background 0.1s;
  }
  .list-item:hover { background:rgba(255,255,255,0.04); }
  .list-item.active { border-left-color:#2dd4bf; background:rgba(45,212,191,0.06); }
  .list-item.active-topic { border-left-color:#d97706; background:rgba(217,119,6,0.06); }

  /* Search input */
  .search-wrap {
    display:flex; align-items:center; gap:6px;
    background:#0d1117; border:1px solid #21262d;
    padding:3px 8px; border-radius:4px; margin:6px 8px;
  }
  .search-wrap:focus-within { border-color:#2dd4bf; }
  .search-wrap input {
    background:none; border:none; color:#e6edf3;
    font-size:11px; font-family:"JetBrains Mono",monospace; flex:1; min-width:0;
  }

  /* Tabs inside sidebar */
  .stab-bar { display:flex; border-bottom:1px solid #21262d; flex-shrink:0; }
  .stab {
    flex:1; padding:5px 0; background:none; border:none; cursor:pointer;
    font-size:10px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase;
    color:#6e7681; border-bottom:2px solid transparent;
  }
  .stab.active-nodes  { color:#2dd4bf; border-bottom-color:#2dd4bf; }
  .stab.active-topics { color:#d97706; border-bottom-color:#d97706; }

  /* Filter chips */
  .chip {
    background:transparent; border:1px solid #21262d; border-radius:12px;
    color:#6e7681; padding:2px 10px; font-size:10px; font-weight:500;
    cursor:pointer; font-family:inherit;
  }
  .chip:hover { border-color:#30363d; color:#c9d1d9; }
  .chip.on { background:#0a2421; color:#2dd4bf; border-color:#1c4a44; }

  /* Status pill */
  .status-pill { display:flex; align-items:center; gap:5px; }
  .status-dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }

  /* Inspector rows */
  .insp-section { padding:8px 12px; border-top:1px solid #21262d; }
  .insp-section:first-child { border-top:none; }
  .insp-label { font-size:10px; font-weight:600; color:#6e7681; text-transform:uppercase; letter-spacing:0.06em; margin-bottom:5px; }
  .insp-value { font-size:11px; font-family:"JetBrains Mono",monospace; color:#e6edf3; word-break:break-all; line-height:1.5; }
  .insp-type  { font-size:10px; font-family:"JetBrains Mono",monospace; color:#8b949e; margin-top:2px; }
  .insp-row   {
    padding:3px 8px; margin-bottom:2px; border-radius:3px;
    font-size:10px; font-family:"JetBrains Mono",monospace; word-break:break-all; line-height:1.5;
    border-left:2px solid;
  }

  /* Overlay */
  .overlay {
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:10px; pointer-events:none;
  }
  .overlay-icon { font-size:28px; }
  .overlay-title { font-size:12px; font-weight:500; color:#8b949e; }
  .overlay-sub   { font-size:10px; font-family:"JetBrains Mono",monospace; color:#484f58; margin-top:2px; }

  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
  @keyframes spin  { to{transform:rotate(360deg)} }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const API_URL = 'http://127.0.0.1:9091/api/ros2/graph';
const POLL_MS = 3000;

// Hex colors for canvas (CSS variables don't work in canvas fillStyle)
const C = {
  bg:       '#0d1117',
  bg2:      '#161b22',
  border:   '#21262d',
  border2:  '#30363d',
  cyan:     '#2dd4bf',
  cyanA:    (a) => `rgba(45,212,191,${a})`,
  amber:    '#d97706',
  amberA:   (a) => `rgba(217,119,6,${a})`,
  text:     '#e6edf3',
  textDim:  '#8b949e',
  textDim2: '#484f58',
};

// ── Force simulation ──────────────────────────────────────────────────────────
function initPositions(nodes) {
  return nodes.map((n, i) => {
    const angle = (i / nodes.length) * Math.PI * 2;
    const r = n.type === 'rosnode' ? 220 : 120;
    return { ...n, x: Math.cos(angle) * r, y: Math.sin(angle) * r, vx:0, vy:0, pinned:false };
  });
}

function tickForce(nodes, edges, alpha) {
  const k_rep=5000, k_spring=0.04, rest=150, damping=0.78;
  for (let i=0; i<nodes.length; i++) {
    for (let j=i+1; j<nodes.length; j++) {
      const dx=nodes[i].x-nodes[j].x, dy=nodes[i].y-nodes[j].y;
      const d2=Math.max(dx*dx+dy*dy,100), inv=1/Math.sqrt(d2);
      const f=(k_rep/d2)*alpha;
      if (!nodes[i].pinned){nodes[i].vx+=dx*inv*f; nodes[i].vy+=dy*inv*f;}
      if (!nodes[j].pinned){nodes[j].vx-=dx*inv*f; nodes[j].vy-=dy*inv*f;}
    }
  }
  const idx=Object.fromEntries(nodes.map(n=>[n.id,n]));
  for (const e of edges) {
    const a=idx[e.s], b=idx[e.t];
    if (!a||!b) continue;
    const dx=b.x-a.x, dy=b.y-a.y, d=Math.sqrt(dx*dx+dy*dy)||1;
    const f=k_spring*(d-rest)*alpha;
    const fx=(dx/d)*f, fy=(dy/d)*f;
    if (!a.pinned){a.vx+=fx; a.vy+=fy;}
    if (!b.pinned){b.vx-=fx; b.vy-=fy;}
  }
  for (const n of nodes) {
    if (n.pinned) continue;
    n.vx+=(-n.x*0.003)*alpha; n.vy+=(-n.y*0.003)*alpha;
    n.vx*=damping; n.vy*=damping;
    n.x+=n.vx; n.y+=n.vy;
  }
}

// ── Graph canvas ──────────────────────────────────────────────────────────────
function GraphCanvas({ graphNodes, graphEdges, selected, onSelect, filterMode }) {
  const canvasRef = useRef(null);
  const st = useRef({ nodes:[], pan:{x:0,y:0}, scale:1, drag:null, hover:null, frame:null });
  const selRef = useRef(selected);
  useEffect(()=>{ selRef.current=selected; }, [selected]);

  const nodeKey = graphNodes.map(n=>n.id).join(',');
  useEffect(()=>{ st.current.nodes=initPositions(graphNodes); }, [nodeKey]);

  function isHidden(n) {
    if (!n) return false;
    if (filterMode==='nodes'  && n.type==='rostopic') return true;
    if (filterMode==='topics' && n.type==='rosnode')  return true;
    return false;
  }

  useEffect(()=>{
    const canvas=canvasRef.current; if (!canvas) return;
    const s=st.current;
    let tick=0;

    function hexPath(ctx,cx,cy,r){
      ctx.beginPath();
      for(let i=0;i<6;i++){const a=(Math.PI/3)*i-Math.PI/6; i===0?ctx.moveTo(cx+r*Math.cos(a),cy+r*Math.sin(a)):ctx.lineTo(cx+r*Math.cos(a),cy+r*Math.sin(a));}
      ctx.closePath();
    }
    function arrow(ctx,x2,y2,ux,uy,color){
      const sz=6,ax=x2-ux*sz,ay=y2-uy*sz,px=-uy*sz*.45,py=ux*sz*.45;
      ctx.beginPath(); ctx.moveTo(ax+px,ay+py); ctx.lineTo(x2,y2); ctx.lineTo(ax-px,ay-py);
      ctx.closePath(); ctx.fillStyle=color; ctx.fill();
    }
    function neighbors(selId){
      if(!selId) return null;
      const ids=new Set([selId]);
      for(const e of graphEdges){if(e.s===selId)ids.add(e.t);if(e.t===selId)ids.add(e.s);}
      return ids;
    }

    function render(){
      const W=canvas.offsetWidth, H=canvas.offsetHeight;
      if(canvas.width!==W||canvas.height!==H){canvas.width=W;canvas.height=H;}
      const ctx=canvas.getContext('2d');
      ctx.clearRect(0,0,W,H);

      // Dot grid background
      ctx.save();
      const ds=32*s.scale;
      const ox=((s.pan.x%ds)+ds)%ds, oy=((s.pan.y%ds)+ds)%ds;
      ctx.fillStyle='rgba(33,38,45,0.6)';
      for(let x=ox-ds;x<W+ds;x+=ds) for(let y=oy-ds;y<H+ds;y+=ds){
        ctx.beginPath();ctx.arc(x,y,1,0,Math.PI*2);ctx.fill();
      }
      ctx.restore();

      ctx.save();
      ctx.translate(s.pan.x+W/2, s.pan.y+H/2);
      ctx.scale(s.scale,s.scale);

      const nmap=Object.fromEntries(s.nodes.map(n=>[n.id,n]));
      const sel=selRef.current;
      const conn=neighbors(sel);
      const t=Date.now()/1000;

      // Edges
      for(const e of graphEdges){
        const a=nmap[e.s], b=nmap[e.t];
        if(!a||!b||isHidden(a)||isHidden(b)) continue;
        const hi=conn&&conn.has(e.s)&&conn.has(e.t);
        const alp=conn?(hi?.9:.05):.45;
        const isPub=e.k==='pub';
        const dx=b.x-a.x, dy=b.y-a.y, len=Math.sqrt(dx*dx+dy*dy)||1;
        const ux=dx/len, uy=dy/len;
        const sr=a.type==='rosnode'?22:12, er=b.type==='rosnode'?22:12;
        const x1=a.x+ux*sr, y1=a.y+uy*sr;
        const x2=b.x-ux*(er+7), y2=b.y-uy*(er+7);

        ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2);
        if(hi){ctx.setLineDash([5,4]); ctx.lineDashOffset=-(t*14)%9;}
        else   ctx.setLineDash([]);
        ctx.strokeStyle=isPub?C.cyanA(alp):C.amberA(alp);
        ctx.lineWidth=hi?1.5:.8; ctx.stroke(); ctx.setLineDash([]);

        ctx.save(); ctx.globalAlpha=conn?(hi?.9:.05):.4;
        arrow(ctx,b.x-ux*er,b.y-uy*er,ux,uy,isPub?C.cyan:C.amber);
        ctx.restore();
      }

      // Nodes
      for(const n of s.nodes){
        if(isHidden(n)) continue;
        const isHov=s.hover===n.id, isSel=sel===n.id;
        const dim=conn&&!conn.has(n.id);
        const isNode=n.type==='rosnode';

        ctx.save(); ctx.globalAlpha=dim?.12:1;

        // Glow ring on selected
        if(isSel){
          ctx.shadowColor=isNode?C.cyan:C.amber; ctx.shadowBlur=16;
          ctx.beginPath();
          if(isNode) hexPath(ctx,n.x,n.y,30); else ctx.arc(n.x,n.y,20,0,Math.PI*2);
          ctx.strokeStyle=isNode?C.cyanA(.25):C.amberA(.25);
          ctx.lineWidth=8; ctx.stroke(); ctx.shadowBlur=0;
        }

        // Body
        ctx.beginPath();
        if(isNode) hexPath(ctx,n.x,n.y,22); else ctx.arc(n.x,n.y,12,0,Math.PI*2);
        ctx.fillStyle=isSel?(isNode?'#0a2421':'#2a1f0a'):C.bg2;
        ctx.fill();
        ctx.strokeStyle=isNode
          ?(isSel||isHov?C.cyan:'#30363d')
          :(isSel||isHov?C.amber:'#30363d');
        ctx.lineWidth=isSel?1.5:.8; ctx.stroke();
        ctx.restore();

        // Label — use text shadow for legibility (no opaque rectangle)
        ctx.save(); ctx.globalAlpha=dim?.12:1;
        ctx.font=`${isSel?'500 ':''} ${isNode?9:8}px "JetBrains Mono",monospace`;
        ctx.textAlign='center';
        const ly=isNode?n.y+37:n.y+24;
        const lbl=n.label.replace(/^\//,'');
        ctx.shadowColor=C.bg; ctx.shadowBlur=5; ctx.shadowOffsetX=0; ctx.shadowOffsetY=0;
        // draw shadow pass twice for more opacity
        ctx.fillStyle=C.bg;
        ctx.fillText(lbl,n.x,ly); ctx.fillText(lbl,n.x,ly);
        ctx.shadowBlur=0;
        ctx.fillStyle=isSel?(isNode?C.cyan:C.amber):(isHov?C.text:C.textDim);
        ctx.fillText(lbl,n.x,ly);
        ctx.restore();
      }

      ctx.restore();
      tick++;
      if(tick<320) tickForce(s.nodes,graphEdges,tick<70?.5:.18);
      s.frame=requestAnimationFrame(render);
    }

    render();
    return()=>cancelAnimationFrame(s.frame);
  }, [graphEdges, filterMode]);

  // Mouse interaction
  useEffect(()=>{
    const canvas=canvasRef.current; if(!canvas) return;
    const s=st.current;

    function toG(mx,my){const W=canvas.offsetWidth,H=canvas.offsetHeight; return{x:(mx-W/2-s.pan.x)/s.scale,y:(my-H/2-s.pan.y)/s.scale};}
    function hit(mx,my){
      const g=toG(mx,my); let best=null,bd=30;
      for(const n of s.nodes){const d=Math.hypot(n.x-g.x,n.y-g.y),r=n.type==='rosnode'?26:17; if(d<r&&d<bd){bd=d;best=n;}}
      return best;
    }
    let pan0=null,drag=false;
    function dn(e){const h=hit(e.offsetX,e.offsetY);if(h){s.drag={n:h};h.pinned=true;drag=false;}else{pan0={x:e.offsetX,y:e.offsetY,px:s.pan.x,py:s.pan.y};drag=false;}}
    function mv(e){
      if(s.drag){const g=toG(e.offsetX,e.offsetY);s.drag.n.x=g.x;s.drag.n.y=g.y;s.drag.n.vx=0;s.drag.n.vy=0;drag=true;}
      else if(pan0){s.pan.x=pan0.px+(e.offsetX-pan0.x);s.pan.y=pan0.py+(e.offsetY-pan0.y);drag=true;}
      else{const h=hit(e.offsetX,e.offsetY);s.hover=h?h.id:null;canvas.style.cursor=h?'pointer':'grab';}
    }
    function up(e){
      if(s.drag){s.drag.n.pinned=false;if(!drag)onSelect(s.drag.n);s.drag=null;}
      else if(pan0){if(!drag)onSelect(null);pan0=null;}
      drag=false;
    }
    function wh(e){e.preventDefault();s.scale=Math.max(.2,Math.min(6,s.scale*(e.deltaY<0?1.1:.91)));}
    function dbl(e){if(!hit(e.offsetX,e.offsetY)){s.pan={x:0,y:0};s.scale=1;}}

    canvas.addEventListener('mousedown',dn);
    canvas.addEventListener('mousemove',mv);
    canvas.addEventListener('mouseup',up);
    canvas.addEventListener('wheel',wh,{passive:false});
    canvas.addEventListener('dblclick',dbl);
    canvas.style.cursor='grab';
    return()=>{
      canvas.removeEventListener('mousedown',dn);
      canvas.removeEventListener('mousemove',mv);
      canvas.removeEventListener('mouseup',up);
      canvas.removeEventListener('wheel',wh);
      canvas.removeEventListener('dblclick',dbl);
    };
  },[onSelect]);

  return <canvas ref={canvasRef} style={{width:'100%',height:'100%',display:'block'}}/>;
}

// ── Overlay (empty / offline state) ──────────────────────────────────────────
function Overlay({status, error}){
  if(status==='live') return null;
  const cfg={
    warming:{spin:true,  color:'#8b949e', title:'Connecting to ROS2…',  sub:'starting graph server'},
    empty:  {spin:false, color:'#d97706', title:'No nodes detected',     sub:'start a ros2 launch to see the graph'},
    offline:{spin:false, color:'#f85149', title:'ROS2 not available',    sub: error||'source /opt/ros/jazzy/setup.bash'},
  }[status]||{spin:false,color:'#8b949e',title:'…',sub:''};
  return(
    <div className="overlay">
      <div style={{fontSize:26,color:cfg.color,animation:cfg.spin?'spin 1.5s linear infinite':'none',lineHeight:1}}>
        {status==='offline'?'✕':status==='empty'?'○':'◌'}
      </div>
      <div style={{textAlign:'center'}}>
        <div className="overlay-title" style={{color:cfg.color}}>{cfg.title}</div>
        <div className="overlay-sub">{cfg.sub}</div>
      </div>
    </div>
  );
}

// ── Sidebar ───────────────────────────────────────────────────────────────────
function Sidebar({nodes, edges, selected, onSelect, search, onSearch}){
  const [tab,setTab]=useState('nodes');
  const rn=nodes.filter(n=>n.type==='rosnode');
  const tp=nodes.filter(n=>n.type==='rostopic');
  const items=(tab==='nodes'?rn:tp).filter(n=>!search||n.label.toLowerCase().includes(search.toLowerCase()));
  const isNode=tab==='nodes';

  return(
    <div style={{height:'100%',display:'flex',flexDirection:'column'}}>
      <div className="search-wrap">
        <span style={{color:'#6e7681',fontSize:11}}>⌕</span>
        <input value={search} onChange={e=>onSearch(e.target.value)} placeholder="filter…"/>
        {search&&<span onClick={()=>onSearch('')} style={{cursor:'pointer',color:'#6e7681',fontSize:11}}>×</span>}
      </div>

      <div className="stab-bar">
        {[['nodes',rn.length],['topics',tp.length]].map(([t,cnt])=>(
          <button key={t} className={`stab ${tab===t?'active-'+t:''}`} onClick={()=>setTab(t)}>
            {t} <span style={{opacity:.5}}>({cnt})</span>
          </button>
        ))}
      </div>

      <div style={{flex:1,overflow:'auto'}}>
        {items.map(n=>{
          const isSel=selected===n.id;
          const pubs=isNode?edges.filter(e=>e.s===n.id&&e.k==='pub').length:edges.filter(e=>e.t===n.id&&e.k==='pub').length;
          const subs=isNode?edges.filter(e=>e.t===n.id&&e.k==='sub').length:edges.filter(e=>e.s===n.id&&e.k==='sub').length;
          const cls=`list-item${isSel?(isNode?' active':' active-topic'):''}`;
          return(
            <div key={n.id} className={cls} onClick={()=>onSelect(isSel?null:n)}>
              <div style={{fontSize:10,fontFamily:'"JetBrains Mono",monospace',wordBreak:'break-all',
                color:isSel?(isNode?'#2dd4bf':'#d97706'):'#c9d1d9',lineHeight:1.4}}>
                {n.label.replace(/^\//,'')}
              </div>
              {n.msgType&&<div style={{fontSize:9,fontFamily:'"JetBrains Mono",monospace',color:'#6e7681',marginTop:1}}>{n.msgType}</div>}
              <div style={{display:'flex',gap:8,marginTop:2}}>
                {pubs>0&&<span style={{fontSize:8,fontFamily:'"JetBrains Mono",monospace',color:'#1a6b63'}}>↑ {pubs} pub</span>}
                {subs>0&&<span style={{fontSize:8,fontFamily:'"JetBrains Mono",monospace',color:'#6b4c1a'}}>↓ {subs} sub</span>}
              </div>
            </div>
          );
        })}
        {items.length===0&&(
          <div style={{padding:20,fontSize:11,color:'#484f58',textAlign:'center'}}>
            {nodes.length===0?'waiting for ROS2…':'no match'}
          </div>
        )}
      </div>
    </div>
  );
}

// ── Inspector ─────────────────────────────────────────────────────────────────
function Inspector({node,edges,allNodes}){
  if(!node) return(
    <div style={{height:'100%',display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:8}}>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#30363d" strokeWidth="1.5">
        <polygon points="12,2 22,7 22,17 12,22 2,17 2,7"/>
        <circle cx="12" cy="12" r="3.5"/>
      </svg>
      <span style={{fontSize:10,color:'#484f58',fontFamily:'"JetBrains Mono",monospace',textAlign:'center',lineHeight:1.8}}>
        CLICK A NODE<br/>OR TOPIC
      </span>
    </div>
  );

  const nmap=Object.fromEntries(allNodes.map(n=>[n.id,n]));
  const isTopic=node.type==='rostopic';
  const pubs=isTopic
    ?edges.filter(e=>e.t===node.id&&e.k==='pub').map(e=>nmap[e.s]).filter(Boolean)
    :edges.filter(e=>e.s===node.id&&e.k==='pub').map(e=>nmap[e.t]).filter(Boolean);
  const subs=isTopic
    ?edges.filter(e=>e.s===node.id&&e.k==='sub').map(e=>nmap[e.t]).filter(Boolean)
    :edges.filter(e=>e.t===node.id&&e.k==='sub').map(e=>nmap[e.s]).filter(Boolean);

  return(
    <div style={{overflow:'auto',height:'100%'}}>
      <div className="insp-section">
        <div className="insp-label">{isTopic?'Topic':'Node'}</div>
        <div className="insp-value" style={{color:isTopic?'#d97706':'#2dd4bf'}}>{node.label}</div>
        {node.msgType&&<div className="insp-type">{node.msgType}</div>}
        {node.hz&&<div style={{fontSize:10,fontFamily:'"JetBrains Mono",monospace',color:'#d97706',marginTop:2}}>~{node.hz} Hz</div>}
      </div>

      {pubs.length>0&&(
        <div className="insp-section">
          <div className="insp-label">{isTopic?'Publishers':'Publishes to'}</div>
          {pubs.map(n=>(
            <div key={n.id} className="insp-row" style={{color:'#2dd4bf',borderLeftColor:'#1a4a44'}}>{n.label}</div>
          ))}
        </div>
      )}
      {subs.length>0&&(
        <div className="insp-section">
          <div className="insp-label">{isTopic?'Subscribers':'Subscribes to'}</div>
          {subs.map(n=>(
            <div key={n.id} className="insp-row" style={{color:'#d97706',borderLeftColor:'#4a3318'}}>{n.label}</div>
          ))}
        </div>
      )}
    </div>
  );
}

// ── App ───────────────────────────────────────────────────────────────────────
function App(){
  const [data,    setData]    = useState({nodes:[],edges:[]});
  const [status,  setStatus]  = useState('warming');
  const [error,   setError]   = useState('');
  const [meta,    setMeta]    = useState({});
  const [sel,     setSel]     = useState(null);
  const [search,  setSearch]  = useState('');
  const [filter,  setFilter]  = useState('all');
  const [ts,      setTs]      = useState(null);

  async function poll(){
    try{
      const r=await fetch(API_URL,{cache:'no-store'});
      if(!r.ok) throw new Error(`HTTP ${r.status}`);
      const d=await r.json();
      if(d.meta) setMeta(d.meta);
      if(d.ok){
        setData({nodes:d.nodes,edges:d.edges});
        setStatus(d.nodes.length>0?'live':'empty');
        setError('');
        if(d.nodes.length>0) setTs(new Date());
      }else{
        setError(d.error||'');
        setStatus(d.error?.includes('warming')?'warming':'offline');
      }
    }catch{setStatus('offline');setError('Cannot reach local API server');}
  }

  useEffect(()=>{poll();const id=setInterval(poll,POLL_MS);return()=>clearInterval(id);},[]);

  const selNode  = data.nodes.find(n=>n.id===sel)||null;
  const nCount   = data.nodes.filter(n=>n.type==='rosnode').length;
  const tCount   = data.nodes.filter(n=>n.type==='rostopic').length;

  const statusDot  = {warming:'#d97706',live:'#3fb950',empty:'#d97706',offline:'#f85149'}[status];
  const statusText = {warming:'Connecting…',live:'Live',empty:'No nodes',offline:'Offline'}[status];

  return(
    <div style={{width:'100%',height:'100%',display:'flex',flexDirection:'column',background:'#0d1117'}}>

      {/* Toolbar */}
      <div className="toolbar">
        {/* Status */}
        <div className="status-pill">
          <div className="status-dot" style={{background:statusDot,animation:status==='warming'?'blink .9s infinite':'none'}}/>
          <span style={{color:statusDot,fontWeight:600}}>{statusText}</span>
        </div>

        {status==='live'&&<>
          <div className="toolbar-sep"/>
          <span style={{color:'#8b949e'}}>
            <span style={{color:'#2dd4bf',fontWeight:600}}>{nCount}</span> nodes ·{' '}
            <span style={{color:'#d97706',fontWeight:600}}>{tCount}</span> topics
          </span>
          {ts&&<span style={{color:'#484f58',fontFamily:'"JetBrains Mono",monospace',fontSize:10}}>
            updated {ts.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'})}
          </span>}
        </>}
        {meta.ros_distro&&<>
          <div className="toolbar-sep"/>
          <span style={{color:'#484f58',fontFamily:'"JetBrains Mono",monospace',fontSize:10}}>
            {meta.ros_distro} · domain {meta.ros_domain_id||'0'}
          </span>
        </>}

        <button onClick={poll} style={{
          background:'none',border:'1px solid #21262d',borderRadius:4,color:'#8b949e',
          padding:'1px 8px',cursor:'pointer',fontSize:10,fontFamily:'inherit',
        }}>↻</button>

        {/* Right side: filter + legend */}
        <div style={{marginLeft:'auto',display:'flex',alignItems:'center',gap:8}}>
          {/* Legend */}
          <svg width="18" height="7"><line x1="0" y1="3.5" x2="12" y2="3.5" stroke="#2dd4bf" strokeWidth="1.5"/><polygon points="12,1 18,3.5 12,6" fill="#2dd4bf"/></svg>
          <span style={{color:'#484f58',fontSize:10}}>pub</span>
          <svg width="18" height="7"><line x1="0" y1="3.5" x2="12" y2="3.5" stroke="#d97706" strokeWidth="1.5"/><polygon points="12,1 18,3.5 12,6" fill="#d97706"/></svg>
          <span style={{color:'#484f58',fontSize:10}}>sub</span>

          <div className="toolbar-sep"/>
          {[['all','All'],['nodes','Nodes'],['topics','Topics']].map(([m,l])=>(
            <button key={m} className={`chip${filter===m?' on':''}`} onClick={()=>setFilter(m)}>{l}</button>
          ))}
          <div className="toolbar-sep"/>
          <span style={{color:'#484f58',fontSize:10,fontFamily:'"JetBrains Mono",monospace'}}>scroll=zoom · dbl=reset</span>
        </div>
      </div>

      {/* Content */}
      <div style={{flex:1,display:'grid',gridTemplateColumns:'190px 1fr 210px',gap:4,padding:4,minHeight:0}}>

        {/* Sidebar */}
        <div className="panel">
          <div className="panel-header">
            <div className="panel-header-dot" style={{background:'#2dd4bf'}}/>
            Nodes &amp; Topics
          </div>
          <div className="panel-body">
            <Sidebar nodes={data.nodes} edges={data.edges}
              selected={sel} onSelect={n=>setSel(n?n.id:null)}
              search={search} onSearch={setSearch}/>
          </div>
        </div>

        {/* Graph */}
        <div className="panel" style={{position:'relative'}}>
          <div className="panel-header">
            <div className="panel-header-dot" style={{background:'#3fb950'}}/>
            Compute Graph
            <span style={{marginLeft:'auto',color:'#484f58',fontSize:10,fontWeight:400}}>
              {selNode?selNode.label:'click to inspect'}
            </span>
          </div>
          <div className="panel-body" style={{position:'relative'}}>
            <GraphCanvas
              graphNodes={data.nodes} graphEdges={data.edges}
              selected={sel} onSelect={n=>setSel(n?n.id:null)}
              filterMode={filter}/>
            <Overlay status={status} error={error}/>
          </div>
        </div>

        {/* Inspector */}
        <div className="panel">
          <div className="panel-header">
            <div className="panel-header-dot" style={{background:selNode?.type==='rostopic'?'#d97706':'#2dd4bf'}}/>
            Inspector
          </div>
          <div className="panel-body">
            <Inspector node={selNode} edges={data.edges} allNodes={data.nodes}/>
          </div>
        </div>

      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
