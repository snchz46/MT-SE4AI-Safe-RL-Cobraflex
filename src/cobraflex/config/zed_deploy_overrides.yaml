# ZED Mini — parámetros para una corrida de despliegue de la cadena RL.
#
# Se pasa al wrapper por `ros_params_override_path` desde
# cobraflex_sensors.launch.xml. NO se edita la config del wrapper de Stereolabs:
# ese paquete no está versionado (D-32) y cualquier cambio ahí se pierde en la
# siguiente reinstalación.
#
# La cadena de despliegue usa UNA sola salida de la ZED: `/zed/zed_node/odom`,
# que el ekf convierte en `/odometry/filtered`, la única fuente de velocidad de
# la cage. Ni las imágenes, ni la profundidad publicada, ni las nubes de puntos,
# ni la detección de objetos tienen un solo suscriptor en esta cadena.
---
/**:
    ros__parameters:

        pos_tracking:
            # Nube de landmarks 3D del tracker publicada para nadie.
            publish_3d_landmarks: false

            # EL ARREGLO DE docs/17 §8.7 (decisión D-73), no una optimización.
            #
            # `ekf_hw.yaml` fusiona la POSE de la ZED (odom0_config x, y, yaw) y
            # deliberadamente no su twist, así que la velocidad sale de derivar
            # la pose. Cuando la ZED cierra un bucle, reinicializa su odometría a
            # la última pose válida y la pose SALTA; el ekf la persigue con
            # covarianza ~1e-5 y odom0_differential:false, y emite un pico de
            # velocidad que entra directo en la única entrada de velocidad de la
            # cage. Medido el 26.08.2026: un salto de 3621,8 mm en un frame
            # (17,81 m/s implícitos) llevó vx del ekf a −4,03 m/s, y otro puso la
            # velocidad de la cage en 5,479 m/s — 25× el contrato de 0,22 —
            # disparando C-04 → C-03 → C-05 y frenando el coche.
            #
            # Sin area memory la odometría deriva más a lo largo del tiempo. Eso
            # es aceptable aquí y no lo era en un caso de navegación: la cage lee
            # VELOCIDAD, no posición, y una deriva lenta no produce picos. Un
            # salto sí.
            area_memory: false
            reset_odom_with_loop_closure: false

        object_detection:
            # Una red neuronal corriendo para nadie. Sin suscriptores en la cadena.
            od_enabled: false

        depth:
            # Nubes de puntos a 10 Hz que nadie consume. La profundidad en sí NO
            # se puede apagar: `depth_mode: NONE` desactiva también el tracking
            # posicional, que es justo lo que necesitamos.
            point_cloud_freq: 0.0

        general:
            # Imágenes y mapa de profundidad publicados a 15 Hz para CERO
            # suscriptores: la cadena de despliegue no lee ni una imagen de la
            # ZED (docs/17 §3: "The ZED image itself is NOT in the loop — only
            # its odometry, via the ekf"). Según el comentario del propio
            # wrapper este parámetro gobierna la PUBLICACIÓN de imágenes y
            # profundidad, no el `grab()` sobre el que corre el tracking — pero
            # eso es documentación del proveedor, no una medida nuestra:
            # confirmar en el coche que la pose sigue igual de sana antes de
            # darlo por bueno.
            pub_frame_rate: 5.0

        sensors:
            # La IMU de la ZED a 100 Hz para nadie: `ekf_hw.yaml` tiene su
            # bloque `imu0` COMENTADO y ningún otro nodo se suscribe. No se
            # apaga del todo porque el launch pide `publish_imu_tf:=true`.
            sensors_pub_rate: 30.0

# ---------------------------------------------------------------------------
# NO APLICADO — la palanca grande, y por qué necesita una medida antes.
#
# `depth.depth_mode` está en 'NEURAL_LIGHT': una red neuronal de profundidad por
# frame en la Jetson, cuyo único consumidor en esta cadena es el tracking
# posicional. 'PERFORMANCE' es el modo no-NONE más barato y mantendría el
# tracking vivo. Junto con `depth.depth_stabilization: 30` (filtrado temporal)
# son los dos candidatos obvios para bajar del 51,1 % de un núcleo que
# `zed_node` marcaba en docs/17 §8.6.
#
# NO se cambian aquí porque ambos alteran la calidad del tracking, y el tracking
# es la ÚNICA fuente de velocidad de la cage: C-03 (TTLC), C-04 (techo) y el
# disparador de alta energía de C-05 leen `/odometry/filtered`, que se deriva de
# esta pose. Un ahorro de CPU que degrade esa señal no es un ahorro. La forma de
# decidirlo es un A/B en el coche como el de docs/17 §8.10 — dos corridas
# seguidas, misma configuración salvo esta línea, comparando %CPU de `zed_node`
# CONTRA la deriva de la pose y los pasos por frame. Hasta entonces, hipótesis.
#
#            depth_mode: 'PERFORMANCE'
#            depth_stabilization: 1
# ---------------------------------------------------------------------------
