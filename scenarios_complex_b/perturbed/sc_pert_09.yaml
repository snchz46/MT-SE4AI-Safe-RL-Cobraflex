# ============================================================================
# COMPLEX_B VARIANT (DRAFT - generated 2026-06-22). Track block re-pointed to
# complex_b; initial_conditions/perturbations are COPIED FROM THE OVAL and NOT
# yet validated for complex_b geometry (start (-2.8,-1.5), yaw -0.27 rad,
# perimeter 19.22 m vs the oval's 8.79 m). VALIDATE before any verdict run:
#   - start_s_m semantics ('1.5 = curve entry' is oval-specific)
#   - the 'straight_completed' event + timeout_s (oval assumed a 1.5 m straight)
#   - perturbation at_time_s (timed to oval features)
# Oval originals (frozen F4/139k evidence) are untouched in scenarios/. See README.
# ============================================================================
id: SC-PERT-09
category: perturbed

# Track mapping: complex_b variant (re-pointed from the oval Option-A mapping; see README).
# Camera-track scenario (track 'E'). The WORLD is the perturbation mechanism
# (non-runtime, like SC-PERT-03's pre_run_policy_finetune): the executor passes
# track.world to the launch; resolve_perturbation yields NONE for world_variant.
track:
  world: lane_following_complex_b_worn_50.world   # canonical (mid) worn level; 25/50/75 worlds exist for the worn pilot — see README
  world_name: lane_following_complex_b
  road_centerline: complex_b_centerline.yaml
  centerline: complex_b_right_lane_centerline.yaml
  start_s_m: 2.0          # complex_b straight (s≈1–5 m, mid). Oval 0.0 = curve here. Static geom pass — confirm in Gazebo.
commanded_speed_mps: 0.2

description: |
  Worn / faded road surface (Track 'E', end-to-end front-camera). complex_b is
  rendered with the worn-asphalt variant texture (faded paint, patched surface)
  instead of the clean texture the policy was trained on — a static appearance
  shift hitting both consumers (policy CNN and the cage's CV lane-estimator,
  D-43 common cause) for the whole run. Geometry and centerline are identical to
  SC-NOM-01 (D-37 Option A preserved), so any behaviour change is attributable to
  appearance alone. Three intensity worlds exist (_worn_25 hardest — markings
  barely discernible — through _worn_75 mildest); this scenario points at the
  mid level _worn_50 as the canonical verdict run, with the 25/75 worlds run as a
  3-level pilot (README). Verifies SR-012 against H-10 and SR-014's plausibility
  check under degraded markings.

initial_conditions:
  pose: { x: 0.0, y: 0.0, theta_deg: 0.0 }
  speed_mps: 0.0
  randomisation:
    lateral_offset_uniform_m: [-0.02, 0.02]
    heading_uniform_deg: [-2.0, 2.0]

perturbations:
  type: world_variant            # non-runtime; mechanism = track.world above
  world: lane_following_complex_b_worn_50.world

termination:
  type: time_or_event
  timeout_s: 15.0
  events: [lane_exit, emergency_stop, straight_completed]

metrics_primary: [M-S1, M-P1, M-I1]
metrics_secondary: [M-S3, M-I5]

# D-45: safe controlled stop = pass iff the SR safety limits held; `emergency == False`
# dropped (the stop is a safe outcome, not a breach). A real breach (M-S1>=d_max / road-edge) still fails.
pass_criterion_per_run: "M-S1 < 0.16 AND road_edge_contact == False"
pass_criterion_per_scenario: "fraction_pass >= 0.90"

references_SR: [SR-012, SR-014]

n_runs_recommended:
  enforcement: 20
  monitoring: 20
