# =============================================================
# Baseline PD controller — parameter file
# -------------------------------------------------------------
# Per Phase 2 plan §10.2 and §10.3 (D31–D32). Values are initial
# guesses from the plan; the empirical tuning campaign described in
# `docs/.phases/Fase 2/phase2_implementation_notes.md` §3.5 may
# revise them. The PD is infrastructure ("good enough to validate the
# pipeline"), not a contribution; final acceptance is the 80 %
# completion-rate threshold of Decision 6 of the supervisor briefing.
# =============================================================

baseline_pd:
  version: "0.5.0"

  # Steering loop — lateral position
  kp_y: 3.0            # was 5.0; reduced now that the curvature feedforward
                       # carries most of the trim, so the PD only has to
                       # null small residual offsets. Lower gain widens the
                       # closed-loop margin against C-06 rate-limit lag.
  kd_y: 0.5            # was 1.0; halved for the same reason and to limit
                       # amplification of finite-difference noise.

  # Steering loop — heading
  kp_h: 1.0            # was 1.5; lowered alongside kp_y for a softer
                       # closed loop.
  kd_h: 0.0            # zeroed because track_heading is piecewise-constant
                       # along the discretised polyline (~7 deg jumps per
                       # ~0.5 s of travel on the curve), so finite-
                       # differencing produces spurious 2-3 rad/s peaks
                       # that saturate the steering.

  # Curvature feedforward. Was kinematically derived as v/yaw_gain=0.25
  # in v0.4.0 assuming the diff-drive plugin honours the commanded yaw
  # rate. Empirically the cobraflex is a 4-wheel skid-steer (see
  # src/cobraflex/urdf/robot.gazebo: four wheel joints paired as 'left'
  # and 'right'), so the actual yaw rate achieved is only ~60% of the
  # commanded one — the wheels skid laterally against ground friction
  # at every cycle. Bumping the feedforward to 0.45 brings the
  # steady-state lateral offset back to ~0 on the R=0.9225 m right-lane
  # curve. Re-derive empirically if you change yaw_to_steering_gain,
  # wheel separation, surface friction, or robot mass.
  kappa_to_steering_gain: 0.45

  # Throttle
  throttle_nominal: 0.5       # nominal cruise throttle on straight
  alpha_curve_slowdown: 0.6   # reduces throttle proportionally to |curvature|

  # Saturation
  steering_limit: 1.0  # normalised actuator range
  throttle_min: 0.0    # lowest throttle command (no negative throttle from PD)
  throttle_max: 1.0
