<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TF Tree — CobraFlex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:100%; height:100%; overflow:hidden; background:#0d1117; }
  body { font-family:"Inter","Segoe UI",sans-serif; font-size:13px; color:#e6edf3; display:flex; flex-direction:column; }

  /* ── Toolbar ── */
  .toolbar {
    background:#0d1117; border-bottom:1px solid #21262d;
    display:flex; align-items:center; gap:12px;
    padding:0 16px; height:38px; flex-shrink:0;
  }
  .toolbar-sep { width:1px; height:16px; background:#21262d; }
  .tb-label { font-size:11px; font-weight:600; color:#8b949e; letter-spacing:.06em; text-transform:uppercase; }
  .tb-meta  { font-size:10px; font-family:"JetBrains Mono",monospace; color:#484f58; }

  /* ── Three-panel grid ── */
  .main {
    flex:1; display:grid;
    grid-template-columns:210px 1fr 224px;
    gap:4px; padding:4px; min-height:0;
  }
  .panel { background:#161b22; border:1px solid #21262d; display:flex; flex-direction:column; overflow:hidden; border-radius:3px; }
  .panel-header {
    padding:5px 10px; border-bottom:1px solid #21262d;
    display:flex; align-items:center; gap:6px; flex-shrink:0;
    background:#0d1117; font-size:10px; font-weight:600;
    color:#8b949e; letter-spacing:.06em; text-transform:uppercase;
  }
  .panel-dot { width:6px; height:6px; border-radius:50%; flex-shrink:0; }
  .panel-body { flex:1; overflow:auto; min-height:0; }

  /* ── Tree list ── */
  .tree-row {
    display:flex; align-items:center; gap:0;
    min-height:22px; cursor:pointer; padding:0 6px 0 0;
    user-select:none;
  }
  .tree-row:hover { background:rgba(139,148,158,.06); }
  .tree-row.active { background:rgba(45,212,191,.07); }
  .tree-pfx  { font-size:9px; font-family:"JetBrains Mono",monospace; color:#30363d; white-space:pre; flex-shrink:0; line-height:22px; }
  .tree-dot  { width:5px; height:5px; border-radius:50%; flex-shrink:0; margin-right:5px; }
  .tree-name { font-size:9.5px; font-family:"JetBrains Mono",monospace; color:#8b949e; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; line-height:22px; }
  .tree-row.active .tree-name { color:#2dd4bf; }
  .tree-row.active .tree-pfx  { color:#30363d; }
  .tree-tag  { font-size:7.5px; color:#484f58; margin-left:4px; flex-shrink:0; font-family:"JetBrains Mono",monospace; white-space:nowrap; }

  /* ── Inspector ── */
  .frame-card { padding:8px 10px; border-top:1px solid #21262d; }
  .frame-card:first-child { border-top:none; }
  .card-label { font-size:9px; font-weight:600; color:#6e7681; text-transform:uppercase; letter-spacing:.06em; margin-bottom:3px; }
  .card-val  { font-size:10.5px; font-family:"JetBrains Mono",monospace; color:#2dd4bf; word-break:break-all; }
  .card-text { font-size:10.5px; color:#c9d1d9; line-height:1.5; }
  .card-mono { font-size:9.5px; font-family:"JetBrains Mono",monospace; color:#8b949e; word-break:break-all; }
  .nav-tag {
    display:inline-block; margin:2px 2px 0 0; padding:2px 6px;
    background:#21262d; border:1px solid #30363d; border-radius:3px;
    font-size:9px; font-family:"JetBrains Mono",monospace; color:#79c0ff;
    cursor:pointer; transition:background .12s;
  }
  .nav-tag:hover { background:#30363d; }
  #insp-placeholder {
    height:100%; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:8px; color:#484f58;
    font-size:10px; font-family:"JetBrains Mono",monospace; text-align:center; line-height:1.8;
  }
</style>
</head>
<body>

<!-- Toolbar -->
<div class="toolbar">
  <span class="tb-label">TF Frames</span>
  <div class="toolbar-sep"></div>
  <span class="tb-meta">my_robot_gazebo.urdf · Jazzy · F3</span>

  <div style="margin-left:auto;display:flex;align-items:center;gap:14px;">
    <!-- Legend -->
    <div style="display:flex;align-items:center;gap:8px;font-size:10px;">
      <span style="display:flex;align-items:center;gap:4px;color:#484f58;">
        <span style="width:7px;height:7px;border-radius:50%;background:#2dd4bf;display:inline-block;box-shadow:0 0 4px #2dd4bf80;"></span>dynamic
      </span>
      <span style="display:flex;align-items:center;gap:4px;color:#484f58;">
        <span style="width:7px;height:7px;border-radius:50%;background:#d97706;display:inline-block;"></span>continuous
      </span>
      <span style="display:flex;align-items:center;gap:4px;color:#484f58;">
        <span style="width:7px;height:7px;border-radius:50%;border:1px solid #30363d;display:inline-block;"></span>static
      </span>
    </div>
    <div class="toolbar-sep"></div>
    <!-- Axis legend -->
    <span style="font-size:10px;color:#484f58;">
      <span style="color:#f85149;font-weight:600;">X</span> fwd &nbsp;
      <span style="color:#3fb950;font-weight:600;">Y</span> left &nbsp;
      <span style="color:#79c0ff;font-weight:600;">Z</span> up
    </span>
    <div class="toolbar-sep"></div>
    <!-- Zoom hint (matches ROS graph) -->
    <span class="tb-meta">scroll=zoom · drag=pan · dbl=reset</span>
  </div>
</div>

<!-- Three panels -->
<div class="main">

  <!-- LEFT: hierarchy tree -->
  <div class="panel">
    <div class="panel-header">
      <div class="panel-dot" style="background:#2dd4bf;"></div>
      Hierarchy
    </div>
    <div class="panel-body" style="padding:4px 0;">
      <div id="tree-list"></div>
    </div>
  </div>

  <!-- CENTER: vehicle schematic with pan/zoom -->
  <div class="panel">
    <div class="panel-header">
      <div class="panel-dot" style="background:#d97706;"></div>
      <span>CobraFlex 1:14 — Top-down view</span>
      <span style="margin-left:auto;font-size:9px;font-family:'JetBrains Mono',monospace;color:#484f58;font-weight:400;">
        chassis 228×130mm · body 228×180mm · wr=37.25mm
      </span>
    </div>
    <div class="panel-body" style="background:#0d1117;position:relative;">
      <svg id="vsvg" viewBox="0 0 700 450" preserveAspectRatio="xMidYMid meet"
           style="width:100%;height:100%;display:block;cursor:grab;">
        <defs>
          <marker id="mx" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto">
            <path d="M0,0.5 L4.5,2.5 L0,4.5 Z" fill="#f85149"/>
          </marker>
          <marker id="my" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto">
            <path d="M0,0.5 L4.5,2.5 L0,4.5 Z" fill="#3fb950"/>
          </marker>
          <radialGradient id="gcyan" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.4"/>
            <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="gamber" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#d97706" stop-opacity="0.35"/>
            <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
          </radialGradient>
          <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
            <path d="M20 0L0 0 0 20" fill="none" stroke="#161b22" stroke-width="0.6"/>
          </pattern>
        </defs>

        <!-- Static background — outside #vp so it always fills the viewport -->
        <rect width="700" height="450" fill="#0d1117"/>

        <!-- ═══════════════════════════════════════════════════════════════
             #vp — everything inside this group is pannable + zoomable.
             JS sets transform="translate(tx,ty) scale(sc)" on this group.
             ═══════════════════════════════════════════════════════════════ -->
        <g id="vp">

          <!-- Grid (large so it covers the viewport after any pan/zoom) -->
          <rect x="-3000" y="-3000" width="7000" height="7000" fill="url(#grid)" opacity="0.6"/>

          <!-- World-frame context label (pans with content) -->
          <text x="14" y="20" font-family="JetBrains Mono,monospace" font-size="8.5" fill="#30363d">world / map / odom</text>
          <text x="14" y="31" font-family="JetBrains Mono,monospace" font-size="7.5" fill="#21262d">not shown on vehicle</text>

          <!-- ── Vehicle geometry (URDF-derived, scale 1.1 px/mm) ──
               ROS +X = forward = SVG right
               ROS +Y = left    = SVG up (decreasing SVG-y)
               base_link center at SVG (340, 225)                  -->

          <!-- Wheels — drawn first (behind body)
               wheel_off_x=60 mm=66 px, wheel_off_y=77 mm=85 px
               Top-down view: width along SVG-x = 2×r = 74.5 mm ≈ 82 px
                              height along SVG-y = w   = 20 mm  ≈ 22 px -->
          <g fill="#141820" stroke="#252d3d" stroke-width="1.2">
            <rect x="233" y="129" width="82" height="22" rx="3"/>  <!-- rear_left  -->
            <rect x="233" y="299" width="82" height="22" rx="3"/>  <!-- rear_right -->
            <rect x="385" y="129" width="82" height="22" rx="3"/>  <!-- front_left -->
            <rect x="385" y="299" width="82" height="22" rx="3"/>  <!-- front_right-->
            <!-- rim detail lines -->
            <line x1="257" y1="129" x2="257" y2="151" stroke="#1e2535" stroke-width="0.8"/>
            <line x1="281" y1="129" x2="281" y2="151" stroke="#1e2535" stroke-width="0.8"/>
            <circle cx="274" cy="140" r="6" fill="none" stroke="#1e2535" stroke-width="0.8"/>
            <line x1="409" y1="129" x2="409" y2="151" stroke="#1e2535" stroke-width="0.8"/>
            <line x1="433" y1="129" x2="433" y2="151" stroke="#1e2535" stroke-width="0.8"/>
            <circle cx="426" cy="140" r="6" fill="none" stroke="#1e2535" stroke-width="0.8"/>
            <line x1="257" y1="299" x2="257" y2="321" stroke="#1e2535" stroke-width="0.8"/>
            <line x1="281" y1="299" x2="281" y2="321" stroke="#1e2535" stroke-width="0.8"/>
            <circle cx="274" cy="310" r="6" fill="none" stroke="#1e2535" stroke-width="0.8"/>
            <line x1="409" y1="299" x2="409" y2="321" stroke="#1e2535" stroke-width="0.8"/>
            <line x1="433" y1="299" x2="433" y2="321" stroke="#1e2535" stroke-width="0.8"/>
            <circle cx="426" cy="310" r="6" fill="none" stroke="#1e2535" stroke-width="0.8"/>
          </g>

          <!-- Wheelbase annotation -->
          <g opacity="0.4">
            <line x1="274" y1="115" x2="426" y2="115" stroke="#484f58" stroke-width="0.7" stroke-dasharray="3 2"/>
            <line x1="274" y1="110" x2="274" y2="120" stroke="#484f58" stroke-width="0.7"/>
            <line x1="426" y1="110" x2="426" y2="120" stroke="#484f58" stroke-width="0.7"/>
            <text x="350" y="112" font-family="JetBrains Mono,monospace" font-size="7.5" fill="#484f58" text-anchor="middle">120 mm wheel base</text>
          </g>

          <!-- Chassis: 228×130 mm = 251×143 px, material=black -->
          <rect x="215" y="154" width="251" height="143" rx="6"
                fill="#141820" stroke="#252d3d" stroke-width="1.2"/>

          <!-- Body shell: 228×180 mm = 251×198 px, material=grey -->
          <rect x="215" y="126" width="251" height="198" rx="10"
                fill="#1c2232" stroke="#2d3d54" stroke-width="1.4" opacity="0.88"/>

          <!-- Front bevel / direction indicator -->
          <polygon points="466,168 480,225 466,282" fill="#141820" opacity="0.6"/>
          <line x1="466" y1="200" x2="475" y2="225" stroke="#2d3d54" stroke-width="0.8"/>
          <line x1="466" y1="250" x2="475" y2="225" stroke="#2d3d54" stroke-width="0.8"/>

          <!-- Chassis label -->
          <text x="290" y="230" font-family="JetBrains Mono,monospace" font-size="8"   fill="#252d3d" text-anchor="middle">chassis</text>
          <text x="290" y="241" font-family="JetBrains Mono,monospace" font-size="7"   fill="#252d3d" text-anchor="middle">228×130×60 mm</text>

          <!-- IMU: imu_link joint xyz = 0.074 0 0.020 from body_link → SVG (421, 225) -->
          <rect x="413" y="219" width="14" height="10" rx="2" fill="#0d1117" stroke="#d97706" stroke-width="1"/>
          <rect x="416" y="222" width="8"  height="4"  rx="1" fill="#d97706" opacity="0.3"/>
          <text x="420" y="213" font-family="JetBrains Mono,monospace" font-size="7" fill="#d9770680" text-anchor="middle">imu</text>

          <!-- RPLidar A2: lidar_link joint xyz = 0 0 0.090 from body_link → SVG (340, 225)
               cylinder r=37.5 mm → 41 px; material=blue -->
          <circle cx="340" cy="225" r="50"  fill="none" stroke="#2d6eb0" stroke-width="0.5" stroke-dasharray="4 5" opacity="0.25"/>
          <circle cx="340" cy="225" r="15"  fill="#0a1520" stroke="#2d6eb0" stroke-width="1.5"/>
          <circle cx="340" cy="225" r="7"   fill="#2d6eb0" opacity="0.25"/>
          <circle cx="340" cy="225" r="3"   fill="#2d6eb0"/>
          <line x1="340" y1="225" x2="340" y2="207" stroke="#2d6eb0" stroke-width="0.8" opacity="0.5"/>
          <line x1="340" y1="225" x2="358" y2="225" stroke="#2d6eb0" stroke-width="0.8" opacity="0.5"/>
          <line x1="340" y1="225" x2="340" y2="243" stroke="#2d6eb0" stroke-width="0.8" opacity="0.5"/>
          <line x1="340" y1="225" x2="322" y2="225" stroke="#2d6eb0" stroke-width="0.8" opacity="0.5"/>
          <text x="340" y="248" font-family="JetBrains Mono,monospace" font-size="7.5" fill="#2d6eb0b0" text-anchor="middle">RPLidar A2</text>

          <!-- ZED Mini: camera_link joint xyz = 0.114 0 0.020 from body_link → SVG (465, 225)
               zedm baseline=63 mm; thin vertical bar at front face; material=yellow/black -->
          <rect x="462" y="193" width="12" height="64" rx="3" fill="#0d1117" stroke="#b08020" stroke-width="1.2"/>
          <circle cx="468" cy="208" r="5"   fill="#0d1117" stroke="#b08020" stroke-width="1"/>
          <circle cx="468" cy="208" r="2.5" fill="#b08020" opacity="0.45"/>
          <circle cx="468" cy="242" r="5"   fill="#0d1117" stroke="#b08020" stroke-width="1"/>
          <circle cx="468" cy="242" r="2.5" fill="#b08020" opacity="0.45"/>
          <path d="M474,208 L510,190 M474,242 L510,260" stroke="#b08020" stroke-width="0.6" stroke-dasharray="3 3" opacity="0.2"/>
          <text x="481" y="229" font-family="JetBrains Mono,monospace" font-size="7.5" fill="#b0802080" text-anchor="middle">ZED Mini</text>

          <!-- Forward label -->
          <text x="548" y="229" font-family="JetBrains Mono,monospace" font-size="9" fill="#30363d">→ fwd</text>

          <!-- Frame markers (populated by JS, must be inside #vp) -->
          <g id="fmarkers"></g>

        </g><!-- /#vp -->

        <!-- ── Axis key — fixed corner, outside #vp so it never pans ── -->
        <g transform="translate(608,378)">
          <rect x="-2" y="-2" width="62" height="44" rx="3" fill="#161b22" stroke="#21262d" stroke-width="1"/>
          <text x="29" y="-8" font-family="JetBrains Mono,monospace" font-size="7" fill="#484f58" text-anchor="middle">axis key</text>
          <line x1="20" y1="22" x2="50" y2="22" stroke="#f85149" stroke-width="1.8" marker-end="url(#mx)"/>
          <text x="53" y="26" font-family="JetBrains Mono,monospace" font-size="8" fill="#f85149">X</text>
          <line x1="20" y1="22" x2="20" y2="-2" stroke="#3fb950" stroke-width="1.8" marker-end="url(#my)"/>
          <text x="22" y="-5" font-family="JetBrains Mono,monospace" font-size="8" fill="#3fb950">Y</text>
          <circle cx="20" cy="22" r="5" fill="none" stroke="#79c0ff" stroke-width="1.2"/>
          <circle cx="20" cy="22" r="2.2" fill="#79c0ff"/>
          <text x="9" y="38" font-family="JetBrains Mono,monospace" font-size="8" fill="#79c0ff">Z⊙</text>
        </g>

      </svg>
    </div>
  </div>

  <!-- RIGHT: inspector -->
  <div class="panel">
    <div class="panel-header">
      <div class="panel-dot" style="background:#79c0ff;" id="insp-dot"></div>
      <span id="insp-title">Inspector</span>
    </div>
    <div class="panel-body" id="insp-body">
      <div id="insp-placeholder">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#30363d" stroke-width="1.5">
          <circle cx="12" cy="12" r="9"/>
          <line x1="12" y1="8" x2="12" y2="13"/>
          <circle cx="12" cy="16" r="0.7" fill="#30363d"/>
        </svg>
        SELECT A FRAME<br/>TO INSPECT
      </div>
    </div>
  </div>

</div><!-- .main -->

<script>
// ── URDF-derived frame data (my_robot_gazebo.urdf) ────────────────────────────
// Scale: 1.1 px/mm  |  base_link center at SVG (340, 225)
// ROS +X (forward) → SVG right (+x)
// ROS +Y (left)    → SVG up   (−y)

const FRAMES = {
  map: {
    label:'map', jointType:'dynamic', parent:null,
    desc:'Global reference frame. Absolute world position. Published by navigation SLAM. May jump on loop-closure.',
    publisher:'slam_toolbox / amcl',
    joint:'N/A — world origin',
    svgPos:null,
  },
  odom: {
    label:'odom', jointType:'dynamic', parent:'map',
    desc:'Odometry frame. Continuous — never jumps, but drifts over time. Published by robot_localization EKF fusing wheel encoders and IMU.',
    publisher:'robot_localization (ekf_filter_node)',
    joint:'dynamic, updated ~50 Hz',
    svgPos:null,
  },
  base_footprint: {
    label:'base_footprint', jointType:'fixed', parent:'odom',
    desc:'2D ground projection. Origin at floor level below base_link. Navigation costmap uses this for collision footprint checks.',
    publisher:'robot_state_publisher',
    joint:'xyz: 0 0 0 m (identity from odom)',
    svgPos:{x:340, y:225},
  },
  base_link: {
    label:'base_link', jointType:'fixed', parent:'base_footprint',
    desc:'Robot chassis origin at wheel-axle height. All kinematic chains (body shell, 4 wheels) branch from here. Chassis: 228×130×60 mm, black.',
    publisher:'robot_state_publisher',
    joint:'xyz: 0 0 0.03725 m  (wheel_radius above ground)',
    svgPos:{x:340, y:225},
  },
  body_link: {
    label:'body_link', jointType:'fixed', parent:'base_link',
    desc:'Upper body shell. Wider than chassis (180 mm vs 130 mm). Parent for all sensor mounts. Box: 228×180×100 mm, grey.',
    publisher:'robot_state_publisher',
    joint:'xyz: 0 0 0.080 m  (body_h/2 + chassis_h/2)',
    svgPos:{x:340, y:225},
  },
  front_left_wheel: {
    label:'front_left_wheel', jointType:'continuous', parent:'base_link',
    desc:'Front-left drive wheel. Continuous joint — rotates around local Z (after −π/2 roll). Cylinder: r=37.25 mm, w=20 mm, black.',
    publisher:'robot_state_publisher + joint_state_publisher',
    joint:'xyz:  0.060  0.077 −0.020 m\nrpy: −π/2 0 0',
    svgPos:{x:426, y:140},
  },
  front_right_wheel: {
    label:'front_right_wheel', jointType:'continuous', parent:'base_link',
    desc:'Front-right drive wheel. Mirror of front_left across body centerline (Y=0).',
    publisher:'robot_state_publisher + joint_state_publisher',
    joint:'xyz:  0.060 −0.077 −0.020 m\nrpy: −π/2 0 0',
    svgPos:{x:426, y:310},
  },
  rear_left_wheel: {
    label:'rear_left_wheel', jointType:'continuous', parent:'base_link',
    desc:'Rear-left drive wheel. Same geometry as front, offset −60 mm in X (rearward).',
    publisher:'robot_state_publisher + joint_state_publisher',
    joint:'xyz: −0.060  0.077 −0.020 m\nrpy: −π/2 0 0',
    svgPos:{x:274, y:140},
  },
  rear_right_wheel: {
    label:'rear_right_wheel', jointType:'continuous', parent:'base_link',
    desc:'Rear-right drive wheel.',
    publisher:'robot_state_publisher + joint_state_publisher',
    joint:'xyz: −0.060 −0.077 −0.020 m\nrpy: −π/2 0 0',
    svgPos:{x:274, y:310},
  },
  lidar_link: {
    label:'lidar_link', jointType:'fixed', parent:'body_link',
    desc:'RPLidar A2M4-R1 sensor origin. 360° horizontal scan, 10 Hz, range ≤12 m. Mounted at body centre-top. Cylinder: r=37.5 mm, h=40 mm, blue.',
    publisher:'static_tf / robot_state_publisher',
    joint:'xyz: 0 0 0.090 m  (body_h/2 + 0.04)\nrpy: 0 0 π',
    svgPos:{x:340, y:225},
  },
  camera_link: {
    label:'camera_link', jointType:'fixed', parent:'body_link',
    desc:'ZED Mini stereo camera mount point. At the front face of the body (body_length/2 = 114 mm forward). Baseline 63 mm, black body.',
    publisher:'static_tf / robot_state_publisher',
    joint:'xyz: 0.114 0 0.020 m  (body_length/2, CL, raised)',
    svgPos:{x:465, y:225},
  },
  camera_link_optical: {
    label:'camera_link_optical', jointType:'fixed', parent:'camera_link',
    desc:'Optical frame — Z-forward, X-right, Y-down convention (camera standard). Rotation-only transform from camera_link. Used by image processing nodes.',
    publisher:'static_tf / robot_state_publisher',
    joint:'xyz: 0 0 0  rpy: −π/2 0 −π/2',
    svgPos:{x:465, y:225},
  },
  imu_link: {
    label:'imu_link', jointType:'fixed', parent:'body_link',
    desc:'IMU sensor frame. Provides linear acceleration + angular velocity fused in EKF to produce the odom→base_footprint transform.',
    publisher:'static_tf / robot_state_publisher',
    joint:'xyz: 0.074 0 0.020 m  (body_length/2 − 0.040)',
    svgPos:{x:421, y:225},
  },
};

// ── Tree order with ASCII-art prefix ─────────────────────────────────────────
const TREE = [
  { id:'map',                  pfx:'',                       tag:''     },
  { id:'odom',                 pfx:'└─ ',                    tag:''     },
  { id:'base_footprint',       pfx:'   └─ ',                 tag:''     },
  { id:'base_link',            pfx:'      └─ ',              tag:''     },
  { id:'body_link',            pfx:'         ├─ ',           tag:''     },
  { id:'lidar_link',           pfx:'         │  ├─ ',        tag:''     },
  { id:'camera_link',          pfx:'         │  ├─ ',        tag:''     },
  { id:'camera_link_optical',  pfx:'         │  │  └─ ',     tag:'opt'  },
  { id:'imu_link',             pfx:'         │  └─ ',        tag:''     },
  { id:'front_left_wheel',     pfx:'         ├─ ',           tag:'FL'   },
  { id:'front_right_wheel',    pfx:'         ├─ ',           tag:'FR'   },
  { id:'rear_left_wheel',      pfx:'         ├─ ',           tag:'RL'   },
  { id:'rear_right_wheel',     pfx:'         └─ ',           tag:'RR'   },
];

const C = {
  cyan:'#2dd4bf', amber:'#d97706', blue:'#79c0ff',
  green:'#3fb950', red:'#f85149',
  text:'#e6edf3', t2:'#c9d1d9', t3:'#8b949e', t4:'#6e7681', t5:'#484f58',
  border:'#30363d',
};

const NS = 'http://www.w3.org/2000/svg';
let activeId = null;

// ── Build tree list ───────────────────────────────────────────────────────────
const treeList = document.getElementById('tree-list');
TREE.forEach(({id, pfx, tag}) => {
  const f = FRAMES[id];
  const row = document.createElement('div');
  row.className = 'tree-row';
  row.id = `tr-${id}`;

  const dotBg = f.jointType === 'dynamic' ? C.cyan
    : f.jointType === 'continuous' ? C.amber : 'transparent';
  const dotBorder = (f.jointType === 'dynamic' || f.jointType === 'continuous')
    ? 'none' : `1px solid #30363d`;
  const dotGlow = f.jointType === 'dynamic'
    ? `box-shadow:0 0 4px ${C.cyan}80;` : '';

  row.innerHTML = `
    <span class="tree-pfx">${pfx}</span>
    <span class="tree-dot" style="background:${dotBg};border:${dotBorder};${dotGlow}"></span>
    <span class="tree-name" title="${f.label}">${f.label}</span>
    ${tag ? `<span class="tree-tag">${tag}</span>` : ''}
  `;
  row.addEventListener('click', () => select(id));
  treeList.appendChild(row);
});

// ── Build SVG frame markers ───────────────────────────────────────────────────
const markersG = document.getElementById('fmarkers');

function svgEl(tag, attrs) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  return e;
}

// Slight positional offsets so overlapping frames (base_footprint/base_link/body_link/lidar_link)
// remain individually clickable via tree; visually they cluster at vehicle centre.
const OFFSET = {
  base_footprint:      {dx: -7, dy:  5},
  base_link:           {dx:  0, dy:  0},
  body_link:           {dx:  7, dy: -5},
  lidar_link:          {dx:  0, dy:-17},
  camera_link:         {dx:  0, dy:  0},
  camera_link_optical: {dx:  0, dy: 13},
  imu_link:            {dx:  0, dy:  0},
  front_left_wheel:    {dx:  0, dy:  0},
  front_right_wheel:   {dx:  0, dy:  0},
  rear_left_wheel:     {dx:  0, dy:  0},
  rear_right_wheel:    {dx:  0, dy:  0},
};

Object.entries(FRAMES).filter(([, f]) => f.svgPos).forEach(([id, f]) => {
  const off = OFFSET[id] || {dx:0, dy:0};
  const cx = f.svgPos.x + off.dx;
  const cy = f.svgPos.y + off.dy;
  const isAmber = f.jointType === 'continuous';

  const g = svgEl('g', {id:`fm-${id}`, style:'cursor:pointer;'});

  // Glow halo
  g.appendChild(svgEl('circle', {
    cx, cy, r:22,
    fill: isAmber ? 'url(#gamber)' : 'url(#gcyan)',
    opacity:0, id:`fh-${id}`,
  }));
  // Selection ring
  g.appendChild(svgEl('circle', {
    cx, cy, r:11, fill:'none',
    stroke: isAmber ? C.amber : C.cyan,
    'stroke-width':1.5, opacity:0, id:`fr-${id}`,
  }));
  // Axis X (+X forward = SVG right, red)
  g.appendChild(svgEl('line', {x1:cx, y1:cy, x2:cx+14, y2:cy,
    stroke:'#f85149', 'stroke-width':1.6, 'marker-end':'url(#mx)'}));
  // Axis Y (+Y left = SVG up, green)
  g.appendChild(svgEl('line', {x1:cx, y1:cy, x2:cx, y2:cy-14,
    stroke:'#3fb950', 'stroke-width':1.6, 'marker-end':'url(#my)'}));
  // Axis Z (out of screen, blue dot)
  g.appendChild(svgEl('circle', {cx, cy, r:4.5, fill:'none', stroke:'#79c0ff', 'stroke-width':1.2}));
  g.appendChild(svgEl('circle', {cx, cy, r:1.8, fill:'#79c0ff'}));
  // Label
  const lbl = svgEl('text', {
    x:cx+5, y:cy-17,
    'font-family':'JetBrains Mono,monospace', 'font-size':7.5,
    fill:C.t5, id:`fl-${id}`,
  });
  lbl.textContent = f.label;
  g.appendChild(lbl);

  g.addEventListener('click', e => { e.stopPropagation(); select(id); });
  g.addEventListener('mouseenter', () => {
    if (activeId !== id) document.getElementById(`fh-${id}`).setAttribute('opacity','0.6');
  });
  g.addEventListener('mouseleave', () => {
    if (activeId !== id) document.getElementById(`fh-${id}`).setAttribute('opacity','0');
  });

  markersG.appendChild(g);
});

// ── Selection logic ───────────────────────────────────────────────────────────
function select(id) {
  const f = FRAMES[id];
  if (!f) return;

  // Deactivate previous
  if (activeId) {
    document.getElementById(`tr-${activeId}`)?.classList.remove('active');
    if (FRAMES[activeId]?.svgPos) {
      document.getElementById(`fr-${activeId}`)?.setAttribute('opacity','0');
      document.getElementById(`fh-${activeId}`)?.setAttribute('opacity','0');
      document.getElementById(`fl-${activeId}`)?.setAttribute('fill', C.t5);
    }
  }
  activeId = id;

  // Activate tree row
  document.getElementById(`tr-${id}`)?.classList.add('active');

  // Activate vehicle marker
  if (f.svgPos) {
    document.getElementById(`fr-${id}`)?.setAttribute('opacity','1');
    document.getElementById(`fh-${id}`)?.setAttribute('opacity','0.9');
    document.getElementById(`fl-${id}`)?.setAttribute('fill',
      f.jointType === 'continuous' ? C.amber : C.cyan);
  }

  // Update inspector
  const dotCol = f.jointType === 'dynamic' ? C.cyan
    : f.jointType === 'continuous' ? C.amber : C.t5;
  document.getElementById('insp-dot').style.background = dotCol;
  document.getElementById('insp-title').textContent = f.label;

  const body = document.getElementById('insp-body');
  body.innerHTML = '';

  function card(label, html) {
    const d = document.createElement('div');
    d.className = 'frame-card';
    d.innerHTML = `<div class="card-label">${label}</div>${html}`;
    body.appendChild(d);
  }

  const typeStr = f.jointType === 'dynamic' ? 'Dynamic — published at runtime'
    : f.jointType === 'continuous' ? 'Continuous joint — rotates during motion'
    : 'Fixed / static (URDF)';
  const typeBg = f.jointType === 'dynamic' ? 'rgba(45,212,191,.08)'
    : f.jointType === 'continuous' ? 'rgba(217,119,6,.08)' : 'rgba(72,79,88,.05)';

  card('Frame',
    `<div class="card-val">${f.label}</div>`);
  card('Description',
    `<div class="card-text">${f.desc}</div>`);
  card('Joint type',
    `<div style="display:flex;align-items:center;gap:6px;padding:3px 6px;background:${typeBg};border-radius:3px;">
      <div style="width:6px;height:6px;border-radius:50%;background:${dotCol};flex-shrink:0;"></div>
      <span style="font-size:10.5px;color:${dotCol};">${typeStr}</span>
    </div>`);
  card('Joint offset (URDF)',
    `<div class="card-mono" style="white-space:pre-line;">${f.joint}</div>`);
  card('Publisher',
    `<div class="card-mono">${f.publisher}</div>`);

  if (!f.svgPos) {
    card('Vehicle', `<div class="card-mono" style="color:#484f58;">
      World-only — no physical link on the robot. Shown in hierarchy only.</div>`);
  }
  if (f.parent) {
    const pf = FRAMES[f.parent];
    card('Parent', `<span class="nav-tag" onclick="select('${f.parent}')">${pf?.label || f.parent}</span>`);
  }
  const children = Object.entries(FRAMES).filter(([,v]) => v.parent === id);
  if (children.length) {
    card('Children', children.map(([cid, cf]) =>
      `<span class="nav-tag" onclick="select('${cid}')">${cf.label}</span>`
    ).join(''));
  }
}

// ── Pan / zoom (same pattern as ROS graph canvas) ─────────────────────────────
const vsvg = document.getElementById('vsvg');
const vp   = document.getElementById('vp');
const VT   = { tx: 0, ty: 0, sc: 1 };

function applyVT() {
  vp.setAttribute('transform', `translate(${VT.tx},${VT.ty}) scale(${VT.sc})`);
}

// Convert a point in screen-pixel space to SVG viewBox space,
// correctly accounting for xMidYMid meet letterboxing.
function toVB(clientX, clientY) {
  const r  = vsvg.getBoundingClientRect();
  const sc = Math.min(r.width / 700, r.height / 450);
  const ox = (r.width  - 700 * sc) / 2;
  const oy = (r.height - 450 * sc) / 2;
  return {
    x: (clientX - r.left - ox) / sc,
    y: (clientY - r.top  - oy) / sc,
  };
}

// Zoom centred on viewBox point (vbx, vby)
function zoomAt(vbx, vby, factor) {
  VT.tx  = vbx + factor * (VT.tx - vbx);
  VT.ty  = vby + factor * (VT.ty - vby);
  VT.sc  = Math.max(0.15, Math.min(8, VT.sc * factor));
  applyVT();
}

// Wheel → zoom
vsvg.addEventListener('wheel', e => {
  e.preventDefault();
  const f  = e.deltaY < 0 ? 1.12 : 1 / 1.12;
  const pt = toVB(e.clientX, e.clientY);
  zoomAt(pt.x, pt.y, f);
}, { passive: false });

// Drag → pan (only when NOT clicking a frame marker)
let panOrigin = null;
let didDrag   = false;

vsvg.addEventListener('mousedown', e => {
  if (e.target.closest('#fmarkers')) return; // let marker handle its own click
  panOrigin = { cx: e.clientX, cy: e.clientY, tx: VT.tx, ty: VT.ty };
  didDrag   = false;
  vsvg.style.cursor = 'grabbing';
});

// Use window so drag continues even if pointer leaves the SVG
window.addEventListener('mousemove', e => {
  if (!panOrigin) return;
  const r  = vsvg.getBoundingClientRect();
  const sc = Math.min(r.width / 700, r.height / 450);
  VT.tx = panOrigin.tx + (e.clientX - panOrigin.cx) / sc;
  VT.ty = panOrigin.ty + (e.clientY - panOrigin.cy) / sc;
  applyVT();
  didDrag = true;
});

window.addEventListener('mouseup', () => {
  if (panOrigin) {
    panOrigin = null;
    vsvg.style.cursor = 'grab';
  }
});

// Double-click on background → reset view (matches ROS graph dblclick behaviour)
vsvg.addEventListener('dblclick', e => {
  if (e.target.closest('#fmarkers')) return;
  VT.tx = 0; VT.ty = 0; VT.sc = 1;
  applyVT();
});
</script>
</body>
</html>
