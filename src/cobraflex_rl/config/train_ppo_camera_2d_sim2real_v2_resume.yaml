# RESUME of train_ppo_camera_2d_sim2real_v2.yaml from its 600k checkpoint.
#
# WHY THIS FILE EXISTS
# The parent run was killed at 620,544 steps by operator error, not by a fault:
# a campaign started beside it reaped its Gazebo with a pkill pattern that matches
# a training's simulator as well as an orphan's (raw_logs/INCIDENTS.md, I-6). The
# 600k checkpoint and its VecNormalize are intact, so the run resumes; ~20k steps
# are lost.
#
# WHAT CHANGES, AND WHY IT IS A RESTORATION RATHER THAN AN EDIT
# `total_timesteps` is ADDED to the parent's count (SB3 reset_num_timesteps=False),
# so 1,900,000 lands on the original 2,500,000 target.
#
# The learning rate is the subtle part. Resuming with the parent's `learning_rate:
# 3e-4` would RESTART the anneal at full rate — a deviation, and in the direction
# I-3 already identified as harmful (at 425k this run sat at 2.59e-4 against the
# trunk's 1.73e-4 at the same step, with approx_kl spiking to 1.68 against a 0.5
# target). The values below reproduce the parent schedule's remaining segment
# exactly:
#
#     parent:  lr(t) = 3e-4 * (0.2 + 0.8*(1 - t/2.5e6))
#              t=600k -> 2.424e-4      t=2.5M -> 6.0e-5
#     resume:  lr(p) = 2.424e-4 * (0.2475 + 0.7525*p),  p: 1 -> 0 over 1.9M
#              p=1    -> 2.424e-4      p=0    -> 6.0e-5
#
#     slope    parent  -3e-4*0.8/2.5e6      = -9.6e-11 per step
#              resume  -2.424e-4*0.7525/1.9e6 = -9.6e-11 per step   (identical)
#
# So the resumed segment is the parent's own schedule continued, not a new one.
# Everything else is copied verbatim, including all four experimental variables.
#
# LAUNCH — both resume paths must be absolute, and the VecNormalize is NOT
# optional: normalize_reward is true, so resuming without it silently resets the
# running reward statistics.
#
#   ros2 launch cobraflex_rl train_lane.launch.py \
#     train_config:=$CFG/train_ppo_camera_2d_sim2real_v2_resume.yaml \
#     resume_from:=<abs>/policy/checkpoints/ppo_gz2d_sim2real_v2_2024_600000_steps.zip \
#     resume_vecnormalize:=<abs>/policy/checkpoints/ppo_gz2d_sim2real_v2_2024_vecnormalize_600000_steps.pkl \
#     run_id:=ppo_gz2d_sim2real_v2_2024_r2
#
# The parent run's evidence directory is left untouched: this writes its own.

total_timesteps: 1900000
learning_rate: 0.0002424
lr_schedule: linear_floor
lr_floor_fraction: 0.2475
target_kl: 0.5
gamma: 0.99
gae_lambda: 0.95
n_steps: 1024
batch_size: 64
n_epochs: 10
clip_range: 0.2
ent_coef: 0.02
vf_coef: 0.5
max_grad_norm: 0.5
normalize_reward: true
clip_range_vf: 0.2
clip_reward: 10.0
device: auto
service_timeout_ms: 3500
seed: 2024
max_episode_steps: 2048
control_dt: 0.1
fixed_speed: 0.2
progress_bounded_tracking: false
viz: false
model_path: cobraflex_ppo_gz2d_sim2real_v2_r2
checkpoint_freq: 25000
sim_real_time_factor: 1
policy: CnnPolicy
action:
  type: steer_throttle
  max_speed_mps: 0.22
  throttle_deadband: 0.05
observation:
  type: camera
  camera:
    topic: /camera/image_raw_lane
    width: 84
    height: 84
    grayscale: true
    frame_stack: 4
mirror_augmentation:
  enabled: true
  p: 0.5
domain_randomization:
  enabled: true
  p_degrade: 0.5
  level_range:
  - 0.2
  - 0.8
  base_mode: low_contrast
  p_base: 1.0
  base_level_range:
  - 0.0
  - 0.15
  base_level_focus_range:
  - 0.55
  - 1.0
  p_base_focus: 0.75
geometric_randomization:
  enabled: true
  p_pose: 1.0
  pitch_delta_rad:
  - -0.026
  - 0.026
  height_scale:
  - 0.9
  - 1.1
  p_lens: 0.1
  calibration_path: experiments/calibration/M6_results.json
dynamics_randomization:
  enabled: false
  friction_range:
  - 0.04
  - 0.07
  mass_scale_range:
  - 0.85
  - 1.15
  yaw_scale_range:
  - 0.8
  - 1.2
  latency_steps_range:
  - 0
  - 2
scene_randomization:
  enabled: false
  dome_intensity_scale:
  - 0.6
  - 1.4
  sun_intensity_scale:
  - 0.5
  - 1.5
  light_tint: 0.1
  asphalt_jitter: 0.08
  line_jitter: 0.15
  grass_jitter: 0.1
reward:
  lateral_error: 2.5
  heading_error: 0.75
  steer_delta: 0.2
  throttle_delta: 0.1
  forward_progress: 1.0
  stall_penalty: 0.5
  stall_progress_min: 0.25
  termination: 25.0
cage:
  enabled: true
  mode: enforcement
  yaml_path: ''
  lookahead_segments: 5
  throttle_nominal: 0.5
  yaw_gain: 0.8
  min_speed_scale: 0.35
  perception_heading_fit_mode: joint_pair_quadratic
  perception_heading_gain: 1.6
  perception_heading_temporal_window: 4
  perception_heading_temporal_ey_track_m: 0.08
  perception_heading_temporal_ey_drift_m: 0.03
  perception_heading_temporal_kappa_gate: 0.3
  perception_heading_temporal_cap_rad: 0.32
spawn_perturbation:
  enabled: true
  heading_rad: 0.15
  lateral_m: 0.05
  random_start_s: true
