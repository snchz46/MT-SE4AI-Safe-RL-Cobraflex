# ODD-Spec TBD closure values.
# ------------------------------------------------------------------
# Fill in the `value` and `source` fields for each TBD that you can
# resolve from your simulator workspace, then run:
#
#   python tools/close_odd_tbds.py            # dry-run (prints diff)
#   python tools/close_odd_tbds.py --apply    # writes the patched ODD-Spec
#
# Conventions:
#   value:   the resolved numeric value (or string for non-numeric
#            answers). Use `null` if the TBD is not yet resolved; the
#            script will skip it and leave the TBD-QN tag untouched
#            in the document.
#   source:  free-text reference to where the value came from
#            (file path + line, derivation formula, design decision).
#   notes:   optional caveats, cross-checks, follow-up actions.
# ------------------------------------------------------------------

tbds:

  TBD-Q1:
    description: "Surface friction coefficient (mu_slide) of the simulated road."
    value: 1.0
    source: "src/cobraflex/worlds/{empty.world,obstacles.world,test_world.sdf} all use `<surface><friction><ode/></friction></surface>` (empty ODE block); Gazebo ODE defaults mu1=mu2=1.0 when no explicit value is set."
    notes: "Value inferred from Gazebo default rather than from an explicit <mu> tag. If a future world introduces an explicit <mu>, re-read and re-run close_odd_tbds.py."

  TBD-Q2:
    description: "Max commanded lateral acceleration in ODD-1 (m/s^2), bounded by FRICTION * g."
    value: 9.81
    source: "Derived: TBD-Q1 * g = 1.0 * 9.81 m/s^2. Upper bound from the no-skid Coulomb limit; the policy's actually-commanded a_lat in ODD-1 is far smaller because curvature is zero."
    notes: "Operational a_lat in ODD-1 is bounded by the steering geometry of the bicycle model, not by this Coulomb ceiling. The figure is the physical envelope, not a typical value."

  TBD-Q3:
    description: "Drivable-corridor edge (m, from centre) used by episode-termination logic."
    value: 0.1225
    source: "src/cobraflex_rl/cobraflex_rl/gazebo_lane_env.py L93: `terminated = abs(track_state.ey) > (self.lane_width * 0.5)` with lane_width = 0.245 m from src/cobraflex_rl/config/centerline.yaml."
    notes: "CORRIDOR_EDGE == LANE_EDGE = LANE_WIDTH/2 = 0.1225 m. The env terminates the episode exactly at the geometric lane edge; no separate corridor margin is configured. The ODD-Spec note 'if the two differ, document the rationale' resolves to 'they do not differ'."

  TBD-Q4:
    description: "Stressor parameters of odd2_nominal_adverse (lighting variance, marking contrast, perception noise sigma)."
    value: "faded markings + non-uniform light; observation noise sigma_lateral=0.03 m; latency/jitter nominal"
    source: "src/cobraflex_rl/config/adverse_profiles.yaml (profiles.odd2_nominal_adverse); sigma = SC-PERT-01 mid level; worn world lane_following_oval_worn.world"
    notes: "F4-entry closure (D-33); sigma injected on observed ey, lighting/markings realised qualitatively by the worn world asset."

  TBD-Q5:
    description: "Stressor parameters of odd2_adverse_with_latency (extra latency ms, jitter ms, actuation noise)."
    value: "extra latency +100 ms (over 50 ms nominal); jitter 20 ms; steering actuation noise 0.02"
    source: "src/cobraflex_rl/config/adverse_profiles.yaml (profiles.odd2_adverse_with_latency); latency = SC-PERT-02 high level; *.LATENCY_NOMINAL = 50 ms (ODD-Spec §9)"
    notes: "F4-entry closure (D-33); injected as an action-delay buffer plus small steering actuation noise."

  TBD-Q6:
    description: "Stressor parameters of odd2_adverse_with_obstacle (obstacle geometry, position distribution, quantity)."
    value: "1 static box 0.10x0.10x0.10 m, qty 1, ~0.05 m lane intrusion at mid-straight (spec only; execution deferred)"
    source: "src/cobraflex_rl/config/adverse_profiles.yaml (profiles.odd2_adverse_with_obstacle); modelled on obstacles.world; partial-intrusion class per ODD-Spec §5.3, ODD-exit on contact §5.7"
    notes: "F4-entry closure (D-33). EXECUTION DEFERRED: the F3 policy observation is 6-dim with no obstacle channel (ODD-Spec §5.1 specifies 8-dim w/ obstacle channels, not yet implemented), so this profile is specified but not run by the F4 campaign until obstacle perception is added."

  TBD-Q7:
    description: "Stressor parameters of odd2_adverse_full (union of TBD-Q4 + Q5 + Q6)."
    value: "union of odd2_nominal_adverse + odd2_adverse_with_latency + odd2_adverse_with_obstacle"
    source: "src/cobraflex_rl/config/adverse_profiles.yaml (profiles.odd2_adverse_full); by construction = Q4 + Q5 + Q6"
    notes: "F4-entry closure (D-33); closes with its three constituents; inherits the Q6 obstacle execution-deferral."

  TBD-Q8:
    description: "Total loop length of odd3_curvy_loop (m)."
    value: 8.0232
    source: "scripts/compose_lane_circuit.py preset oval_R080: perimeter = 2 * 1.5 m straights + 2 * pi * 0.80 m arcs; emitted into src/cobraflex_rl/config/oval_centerline.yaml under centerline.perimeter_m."
    notes: "Single source of truth is the composer; switching --straight-length or --preset re-derives this value automatically."

  TBD-Q9:
    description: "Maximum local curvature of odd3_curvy_loop (KAPPA_MAX, 1/m)."
    value: 1.25
    source: "R_min = 0.80 m on the curve_R080cm_A180deg.png tiles of oval_R080. KAPPA_MAX = 1 / R_min = 1.25 m^-1."
    notes: "Cross-check against M-4 still pending. Other composer presets give: oval_R050 -> 2.00, oval_R120 -> 0.833."

  TBD-Q10:
    description: "Max commanded lateral acceleration in ODD-3 (m/s^2), bounded by V_MAX_CURVE^2 * KAPPA_MAX and FRICTION * g."
    value: null            # deferred to M-4 calibration
    source: "Upper-bound operational: V_MAX_CURVE^2 * KAPPA_MAX = 0.25^2 * 1.25 = 0.078 m/s^2. Coulomb ceiling: FRICTION * g = 9.81 m/s^2."
    notes: "Final value closes when M-4 measures the achievable acceleration envelope on the physical platform."

  TBD-Q11:
    description: "Stuck-criterion timeout (s) used by episode-termination logic."
    value: "n/a"
    source: "No dedicated stuck monitor configured; gazebo_lane_env.py truncates at max_episode_steps * control_dt = 500 * 0.10 s = 50 s (raised from 400/40 s in F3; closure unchanged: n/a, subsumed by truncation)."
    notes: "If a separate stuck check is added in Phase 4+, reopen this entry with its specific timeout value."

  TBD-Q12:
    description: "Do ODD-4 named profiles introduce any stressor beyond their ODD-2 counterparts?"
    value: "No additional stressors"
    source: "ODD-Spec §7.1: ODD-4 = scenery(ODD-3) + environmental+dynamic(ODD-2) + profiles; the named ODD-4 profiles are the pure cross-product of ODD-3 geometry x ODD-2 stressors (src/cobraflex_rl/config/adverse_profiles.yaml odd4_profiles)"
    notes: "F4-entry closure (D-33); ODD-4 introduces no stressor mechanism absent from ODD-2 — only the curvy-loop geometry differs, already captured by ODD-3."
