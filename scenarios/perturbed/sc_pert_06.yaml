id: SC-PERT-06
category: perturbed

# Track mapping (Option A — oval; see docs/05). Camera-track scenario (track 'E').
track:
  world: lane_following_oval.world
  centerline: oval_right_lane_centerline.yaml
  start_s_m: 0.0
commanded_speed_mps: 0.2

description: |
  Motion blur (Track 'E', end-to-end front-camera). A directional box blur
  (visual_degradation.apply_motion_blur, horizontal axis — the dominant smear for a
  forward camera on a turning vehicle) degrades the frame throughout the run, before
  both consumers (D-43 common cause). The policy must keep the lane; the cage's CV
  estimator tolerates blur well (GE2 oracle validation: detection 100% at level 0.5,
  |ey| MAE ~10 mm). Verifies SR-012 against hazard H-10.

initial_conditions:
  pose: { x: 0.0, y: 0.0, theta_deg: 0.0 }
  speed_mps: 0.0
  randomisation:
    lateral_offset_uniform_m: [-0.02, 0.02]
    heading_uniform_deg: [-2.0, 2.0]

perturbations:
  type: visual_degradation
  mode: motion_blur
  level_levels: [0.4, 0.8]

termination:
  type: time_or_event
  timeout_s: 15.0
  events: [lane_exit, emergency_stop, straight_completed]

metrics_primary: [M-S1, M-P1, M-I1]
metrics_secondary: [M-S3, M-I5]

pass_criterion_per_run: "M-S1 < 0.16 AND road_edge_contact == False AND emergency == False"
pass_criterion_per_scenario: "fraction_pass >= 0.90"

references_SR: [SR-012]

n_runs_recommended:
  enforcement: 40          # 20 per level × 2 levels
  monitoring: 40
