# ============================================================================
# COMPLEX_B VARIANT (DRAFT - generated 2026-06-22). Track block re-pointed to
# complex_b; initial_conditions/perturbations are COPIED FROM THE OVAL and NOT
# yet validated for complex_b geometry (start (-2.8,-1.5), yaw -0.27 rad,
# perimeter 19.22 m vs the oval's 8.79 m). VALIDATE before any verdict run:
#   - start_s_m semantics ('1.5 = curve entry' is oval-specific)
#   - the 'straight_completed' event + timeout_s (oval assumed a 1.5 m straight)
#   - perturbation at_time_s (timed to oval features)
# Oval originals (frozen F4/139k evidence) are untouched in scenarios/. See README.
# ============================================================================
id: SC-FRONT-01
category: frontier
# Frontier / out-of-ODD scenario (cage-efficacy study). Traces to ODD-Spec §4.7:
# beyond the ODD-1 exit boundary (|ey| > 0.1225 m) recovery is the cage's job
# (C-01 / C-05, SR-001 / SR-005). Analysed as a PAIRED enforcement-vs-monitoring
# contrast (monitoring = no-cage counterfactual), not by fraction_pass aggregation.
track:
  world: lane_following_oval_complex.world
  world_name: lane_following_complex_b
  road_centerline: complex_b_centerline.yaml
  centerline: complex_b_right_lane_centerline.yaml
  start_s_m: 2.0          # complex_b straight (s≈1–5 m, mid). Oval 0.0 = curve here. Static geom pass — confirm in Gazebo.
commanded_speed_mps: 0.2

description: |
  Lateral out-of-ODD start. The vehicle is initialised at 0.16 m lateral offset —
  past the lane edge (0.1225 m) and at the cage's C-01 d_max threshold (0.16 m),
  with zero heading error. Tests whether the cage holds the vehicle off the road
  edge (0.26 m) when the policy starts beyond its design envelope. Under monitoring
  the no-cage policy is expected to drift to the edge (H-01 lane departure).

initial_conditions:
  pose: { x: 0.0, y: 0.16, theta_deg: 0.0 }   # y = lateral offset at C-01 threshold
  speed_mps: 0.2
  randomisation:
    lateral_offset_uniform_m: [-0.01, 0.01]
    heading_uniform_deg: [-2.0, 2.0]

perturbations: none

termination:
  type: time_or_event
  timeout_s: 15.0
  events: [road_edge_contact, emergency_stop, recovered]

metrics_primary: [road_edge_contact, max_excursion_m, M-S1, M-S2]
metrics_secondary: [M-I1, M-I2]

pass_criterion_per_run: "road_edge_contact == False"
pass_criterion_per_scenario: "fraction_pass >= 0.90"

references_SR: [SR-001, SR-005]

n_runs_recommended:
  enforcement: 25
  monitoring: 25
