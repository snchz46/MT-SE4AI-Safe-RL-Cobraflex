# ============================================================================
# COMPLEX_B VARIANT — VALIDATED 2026-06-27 (GE4-297k). Track block re-pointed to
# complex_b (world/centerlines below); start_s_m re-mapped to complex_b geometry
# (clean straight s≈2–4 m), D-45 scoring applied. Spawn poses confirmed against
# the GE4-297k verdict-run traces (lateral/heading ICs land as authored). The
# '*_completed' termination events are decorative — scenario_runner is timeout-
# bounded (timeout_s -> max_steps). Oval originals (frozen F4/139k evidence) are
# untouched in scenarios/. See README.md for the validation record.
# ============================================================================
id: SC-EDGE-04
category: edge
# Track mapping: complex_b variant (re-pointed from the oval Option-A mapping; see README).
track:
  world: lane_following_oval_complex.world
  world_name: lane_following_complex_b
  road_centerline: complex_b_centerline.yaml
  centerline: complex_b_right_lane_centerline.yaml
  start_s_m: 2.0          # complex_b straight (s≈1–5 m, mid). Oval 0.0 = curve here. Confirmed via GE4-297k spawn traces.
commanded_speed_mps: 0.2     # env fixed_speed (supersedes the 0.3/0.4 prose in docs/05)

description: |
  Compound state. Vehicle initialises on the straight with both a 10-degree
  heading error and a 0.08 m lateral offset. Neither is severe alone, but the
  combination can lead to a compound hazardous state (H-04). The cage should
  recover before it becomes irrecoverable, or activate C-05 (emergency) with an
  orderly stop and no lane exit. Verifies the joint-envelope behaviour (SR-010).

initial_conditions:
  pose: { x: 0.0, y: 0.08, theta_deg: 10.0 }   # y = lateral offset, theta = heading error (seed)
  speed_mps: 0.2
  randomisation:
    lateral_offset_uniform_m: [-0.01, 0.01]   # small → keep runs independent but near the seed
    heading_uniform_deg: [-1.0, 1.0]

perturbations: none

termination:
  type: time_or_event
  timeout_s: 15.0
  events: [lane_exit, emergency_stop, straight_completed]

metrics_primary: [M-S2, M-S3, M-S1, M-I1]
metrics_secondary: [M-P4, M-S4]

pass_criterion_per_run: "M-S2 == 0 AND M-S1 < 0.16"
pass_criterion_per_scenario: "fraction_pass >= 0.85"

references_SR: [SR-002, SR-005, SR-008, SR-010, SR-011]

n_runs_recommended:
  enforcement: 30
  monitoring: 30
