# ============================================================================
# COMPLEX_B VARIANT (DRAFT - generated 2026-06-22). Track block re-pointed to
# complex_b; initial_conditions/perturbations are COPIED FROM THE OVAL and NOT
# yet validated for complex_b geometry (start (-2.8,-1.5), yaw -0.27 rad,
# perimeter 19.22 m vs the oval's 8.79 m). VALIDATE before any verdict run:
#   - start_s_m semantics ('1.5 = curve entry' is oval-specific)
#   - the 'straight_completed' event + timeout_s (oval assumed a 1.5 m straight)
#   - perturbation at_time_s (timed to oval features)
# Oval originals (frozen F4/139k evidence) are untouched in scenarios/. See README.
# ============================================================================
id: SC-PERT-07
category: perturbed

# Track mapping: complex_b variant (re-pointed from the oval Option-A mapping; see README).
track:
  world: lane_following_oval_complex.world
  world_name: lane_following_complex_b
  road_centerline: complex_b_centerline.yaml
  centerline: complex_b_right_lane_centerline.yaml
  start_s_m: 2.0          # complex_b straight (s≈1–5 m, mid). Oval 0.0 = curve here. Static geom pass — confirm in Gazebo.
commanded_speed_mps: 0.2

description: |
  Lane occlusion / perception loss (Track 'E', end-to-end front-camera). After a nominal
  lead-in, the near-field lane features are occluded (visual_degradation.apply_occlusion —
  an opaque patch growing from the bottom of the frame, modelling debris / deep shadow
  swallowing the markings), before both consumers (D-43 common cause). Level 1.0 covers
  the full ground-view band (GE2 oracle validation: at 0.5 the far field still yields
  single-line estimates, so full coverage is required for a guaranteed loss); the cage's
  CV lane-estimator loses the lane and the perception supervisor must raise C-05 Trigger 8 within
  its persistence budget and execute the OPEN-LOOP controlled stop, which needs no
  perception. The run passes when the emergency fires and the trajectory stays bounded
  with no road-edge contact. Verifies SR-013 against hazard H-11 (SR-012 secondarily).

initial_conditions:
  pose: { x: 0.0, y: 0.0, theta_deg: 0.0 }
  speed_mps: 0.0
  randomisation:
    lateral_offset_uniform_m: [-0.02, 0.02]
    heading_uniform_deg: [-2.0, 2.0]

perturbations:
  type: perception_loss
  mode: occlusion
  level_levels: [1.0]
  at_time_s: 5.0           # nominal lead-in, loss injected mid-run

termination:
  type: time_or_event
  timeout_s: 15.0
  events: [lane_exit, emergency_stop, straight_completed]

metrics_primary: [M-S1, M-S3, M-I1]
metrics_secondary: [M-P1, M-I5]

pass_criterion_per_run: "emergency == True AND M-S1 < 0.16 AND road_edge_contact == False"
pass_criterion_per_scenario: "fraction_pass >= 0.90"

references_SR: [SR-013, SR-012]

n_runs_recommended:
  enforcement: 20
  monitoring: 20
