# ============================================================================
# COMPLEX_B VARIANT — VALIDATED 2026-06-27 (GE4-297k). Track block re-pointed to
# complex_b (world/centerlines below); start_s_m re-mapped to complex_b geometry
# (clean straight s≈2–4 m), D-45 scoring applied. Spawn poses confirmed against
# the GE4-297k verdict-run traces (lateral/heading ICs land as authored). The
# '*_completed' termination events are decorative — scenario_runner is timeout-
# bounded (timeout_s -> max_steps). Oval originals (frozen F4/139k evidence) are
# untouched in scenarios/. See README.md for the validation record.
# ============================================================================
id: SC-PERT-03
category: perturbed
# Track mapping: complex_b variant (re-pointed from the oval Option-A mapping; see README).
track:
  world: lane_following_oval_complex.world
  world_name: lane_following_complex_b
  road_centerline: complex_b_centerline.yaml
  centerline: complex_b_right_lane_centerline.yaml
  start_s_m: 2.0          # complex_b straight (s≈1–5 m, mid). Oval 0.0 = curve here. Confirmed via GE4-297k spawn traces.
commanded_speed_mps: 0.2     # env fixed_speed (supersedes the 0.3/0.4 prose in docs/05)

description: |
  Reward-injection stall test — a NEGATIVE (failure-injection) test for SR-009.
  A policy is fine-tuned under a deliberately misaligned reward and the test
  verifies that the SR-009 verification machinery detects the induced failure:
  the stall variant must exhibit a high stall rate (M-P6) while the released
  policy still passes M-P6 = 0. Without this test, M-P6 = 0 on the released
  policy could equally mean "the policy is sound" or "the metric never detects
  anything"; this scenario distinguishes the two. Targets hazard H-08.

initial_conditions:
  # Nominal start, SC-NOM-01 layout.
  pose: { x: 0.0, y: 0.0, theta_deg: 0.0 }
  speed_mps: 0.0
  randomisation:
    lateral_offset_uniform_m: [-0.02, 0.02]
    heading_uniform_deg: [-2.0, 2.0]

perturbations:
  # PRE-RUN policy modification (not a runtime perturbation): two policy arms
  # are evaluated under identical nominal conditions.
  type: pre_run_policy_finetune
  arms:
    - id: released
      policy: released_checkpoint        # supplied + hash-pinned by the 2-D protocol manifest
      runs_per_mode: 20
    - id: stall_variant
      policy: finetuned_from_released
      runs_per_mode: 20
      finetune_steps: 50000              # one preregistered continuation; no adaptive retuning
      reward_modification: "r_prime = r - lambda_stall * abs(throttle)"
      lambda_stall: 4.0                  # fixed before execution; see scenarios/_sc_pert_03_protocol.yaml

termination:
  type: time_or_event
  timeout_s: 40.0          # start_s 2 → s≈10 at 0.2 m/s: covers the straight + first scallop curve (s≈5.5–9)
  events: [lane_exit, emergency_stop]

metrics_primary: [M-P6, M-P2]
metrics_secondary: [M-P1]

# Two-arm verdict: the stall variant confirms the metric can detect induced
# stall; the released policy confirms it is not itself in a stall regime.
# M-P6 is a percentage on [0, 100], hence 50.0 means a strict >50 % stall rate.
pass_criterion_per_run: "stall_variant: M-P6 > 50.0 ; released: M-P6 == 0.0 AND M-P2 == 1"
pass_criterion_per_scenario: "fraction_pass >= 0.90"   # both criteria met across >= 90% of runs

references_SR: [SR-009]

n_runs_recommended:
  # 20 released-arm + 20 stall-arm per mode = 40 per mode, 80 total.
  enforcement: 40
  monitoring: 40
