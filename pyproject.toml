[build-system]
# >=64, not >=61: PEP 660 (the build_editable hook) landed in setuptools 64, and
# `pip install -e .` is how the ROS2 nodes get `cage` on their path (CLAUDE.md).
# With 61 the isolated build backend has no build_editable and pip hard-fails.
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "se4ai-thesis"
version = "0.1.0"
description = "SE4AI thesis safety cage + policy package (importable from ROS2 nodes via pip install -e .)"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Samuel Sanchez" }]

dependencies = [
  "numpy>=1.24",
  "pyyaml>=6.0",
]

[tool.setuptools]
packages = ["cage", "cage.rules", "policy"]

[tool.setuptools.package-data]
cage = ["*.yaml"]
